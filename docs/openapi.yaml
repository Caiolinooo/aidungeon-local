          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mod e o resumo das versões.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mod'
        '404':
          $ref: '#/components/responses/NotFound'

