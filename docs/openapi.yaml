      parameters:
        - name: publicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Publicação apagada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDeleteResult'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/publications/{publicationId}/versions/{version}:
    get:
