      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Versão já existente (mesmo hash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDetail'
        '201':
          description: Publicação ou versão nova.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationDetail'
        '400':
          description: invalid_kind ou invalid_source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Quem não é dono da fonte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

