openapi: 3.0.3
info:
  title: AI Dungeon Local — API
  version: 0.4.0
  description: |
    API REST do clone local do AI Dungeon (PLANO.md §4.4).

    Convenções gerais:
    - Todos os endpoints respondem JSON (`application/json`), exceto:
      - os endpoints de geração (`/action`, `/continue`, `/retry`), que respondem
        `text/event-stream` (SSE) — ver tag `generation`;
      - `/api/adventures/{id}/export`, que responde `application/zip`.
    - Booleans do banco (INTEGER 0/1) são expostos como `true/false`.
    - Campos `tags` e `triggers` são TEXT JSON no banco, expostos como arrays.
    - Timestamps em ISO-8601 UTC.
    - Erros seguem o schema `Error`.
  contact:
    name: AI Dungeon Local (self-hosted)
servers:
  - url: http://127.0.0.1:8000
    description: backend local (FastAPI)

tags:
  - name: auth
    description: Login e verificação de token. Todas as demais rotas /api exigem Bearer.
  - name: scenarios
  - name: adventures
  - name: generation
    description: Endpoints que geram texto via LLM e streamam por SSE.
  - name: actions
  - name: cards
  - name: memory
  - name: import-export
  - name: settings
    description: Área de configuração do servidor LLM (endpoint, chave, modelo, tokens).
  - name: assistant
    description: Assistente de criação de cenários (geração estruturada via LLM).
  - name: images
    description: Geração de imagens da cena (ação "See") — provedor sdwebui local/LAN ou endpoint OpenAI-compatible.
  - name: assets
    description: Pipeline assíncrono de assets (v0.3.0) — fila de jobs que gera retratos de NPCs em background; a UI faz polling e aplica cada asset ao concluir.
  - name: voice
    description: Voz (v0.4.0) — TTS Supertonic e STT Whisper via stack OpenAI-compatível da VM; /tts devolve bytes audio/mpeg (não JSON).
  - name: ui-profile
    description: Controles dinâmicos (v0.7.0) — manifesto do painel gerado pela IA (tabs + widgets) e estado dos widgets editável pelo jogador.
  - name: consistency
    description: Cross-check do projeto — ficha do NPC ↔ prompt de retrato ↔ imagem ↔ memória ↔ embedding, com reparo por IA.
  - name: health

# Toda rota /api exige Bearer token, exceto as marcadas com `security: []` (login).
# Arquivos estáticos da SPA (fora de /api) são públicos — a página de login precisa carregar.
security:
  - bearerAuth: []

paths:
  # --------------------------------------------------------------------- auth
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login — devolve token Bearer
      operationId: login
      security: []
      description: |
        Valida username/senha contra AUTH_USER e AUTH_PASSWORD_HASH (sha256)
        do ambiente. Sucesso devolve token HMAC-SHA256 assinado com AUTH_SECRET
        (TTL de settings.auth.token_ttl_hours). Falha devolve 401 genérico
        (não distingue usuário de senha).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/check:
    get:
      tags: [auth]
      summary: Verificar se o token atual é válido
      operationId: checkAuth
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  user:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ---------------------------------------------------------------- scenarios
  /api/scenarios:
    post:
      tags: [scenarios]
      summary: Criar scenario
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '201':
          description: Scenario criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [scenarios]
      summary: Listar scenarios (biblioteca, com busca por tag)
      operationId: listScenarios
      parameters:
        - name: tag
          in: query
          description: Filtra scenarios que contêm a tag.
          schema:
            type: string
        - name: q
          in: query
          description: Busca textual em título/descrição.
          schema:
            type: string
      responses:
        '200':
          description: Lista de scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'

  /api/scenarios/{scenarioId}:
    get:
      tags: [scenarios]
      summary: Obter scenario por id
      operationId: getScenario
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: Scenario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- adventures
  /api/adventures:
    post:
      tags: [adventures]
      summary: Nova aventura (a partir de scenario ou vazia)
      operationId: createAdventure
      description: |
        Com `scenario_id`, copia os campos do scenario para a aventura e grava
        a action inicial (`type=start`, texto = `opening_text` do scenario).
        Sem `scenario_id`, cria aventura em branco.

        Na criação a partir de scenario os NPCs já nascem com a ficha
        determinística preenchida (status, classe inferida, atributos
        estimados), os retratos entram na fila e a resposta traz o relatório
        da auditoria no campo `consistency`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdventureCreate'
      responses:
        '201':
          description: Aventura criada (estado completo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureState'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [adventures]
      summary: Listar aventuras (home)
      operationId: listAdventures
      responses:
        '200':
          description: Cards da home, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdventureSummary'

  /api/adventures/{adventureId}:
    get:
      tags: [adventures]
      summary: Estado completo da aventura (para a UI)
      operationId: getAdventure
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Aventura + ações + cards + memórias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureState'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- generation
  /api/adventures/{adventureId}/action:
    post:
      tags: [generation]
      summary: Enviar ação do jogador (Do/Say/Story) — SSE
      operationId: postAction
      description: |
        Persiste a ação do jogador e gera a continuação via LLM.

        Formatação aplicada antes de enviar ao modelo (PLANO.md §4.2):
        - `do`    → `\n> You {text}\n`
        - `say`   → `\n> You say "{text}"\n`
        - `story` → prosa pura

        **Resposta SSE (`text/event-stream`)** — sequência de eventos:
        ```
        event: token
        data: {"token": "You"}

        event: token
        data: {"token": " draw"}

        event: done
        data: {"player_action": {Action}, "action": {Action}}
        ```
        Em falha do LLM, o stream termina com:
        ```
        event: error
        data: {"message": "llm unreachable"}
        ```
        O evento `done` traz a action `continue` persistida (em `action`) e a
        ação do jogador persistida (em `player_action`).

        Com a checagem de viabilidade ligada (`action_check.enabled` em
        `config/settings.json`), o stream emite **antes** dos tokens:
        ```
        event: action_check
        data: {"possible": true, "blockers": [], "risks": [], "notes": ""}
        ```
        O veredito também volta em `data.action_check` do evento `done`.
        Quando a checagem não roda (ação curta, tipo `story`, LLM fora do ar),
        o evento simplesmente não é emitido.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Stream SSE de tokens (`token`), encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
              example: "event: token\ndata: {\"token\": \"You\"}\n\nevent: done\ndata: {\"action\": {\"id\": 42, \"type\": \"continue\"}}\n\n"
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Já existe uma geração em andamento para esta aventura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/continue:
    post:
      tags: [generation]
      summary: IA continua sozinha — SSE
      operationId: postContinue
      description: |
        Gera a continuação sem nova entrada do jogador. Mesmo formato SSE de
        `/action`; o evento `done` traz apenas `{"action": {Action}}`
        (a action `continue` persistida).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Stream SSE de tokens, encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração em andamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/retry:
    post:
      tags: [generation]
      summary: Regenerar última resposta da IA — SSE
      operationId: postRetry
      description: |
        Substitui a última action `continue` por uma nova geração (mesmo
        contexto anterior a ela). Se a última ação não for da IA, responde 409.
        Mesmo formato SSE de `/action`; o evento `done` traz a action
        `continue` substituta (mesmo `seq`, novo `id`).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Stream SSE de tokens, encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Última ação não é regenerável ou geração em andamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/undo:
    post:
      tags: [adventures]
      summary: Desfazer último turno
      operationId: postUndo
      description: |
        Remove o último turno (a resposta da IA e, se houver, a ação do jogador
        que a originou) e devolve o que foi removido. Nunca remove a action
        `start` — nesse caso responde 409.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Turno removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nada a desfazer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ------------------------------------------------------------------ actions
  /api/actions/{actionId}:
    patch:
      tags: [actions]
      summary: Editar texto de qualquer ação (Edit)
      operationId: patchAction
      description: Atualiza `text` e marca `edited_at`. Vale também para respostas da IA.
      parameters:
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPatch'
      responses:
        '200':
          description: Ação atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # -------------------------------------------------------------------- cards
  /api/adventures/{adventureId}/cards:
    post:
      tags: [cards]
      summary: Criar story card
      operationId: createCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCardUpsert'
      responses:
        '201':
          description: Card criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [cards]
      summary: Listar story cards da aventura
      operationId: listCards
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Busca textual case-insensitive em título, triggers e entry
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Filtro por tipo de card (character, location, item, lore, etc.)
        - name: pinned
          in: query
          required: false
          schema:
            type: boolean
          description: Filtro por status fixado (pinned)
      responses:
        '200':
          description: Lista de cards (pinned primeiro).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/bulk:
    post:
      tags: [cards]
      summary: Executar operações em lote sobre story cards
      operationId: bulkCardsAction
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardBulkAction'
      responses:
        '200':
          description: Operação em lote concluída com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardBulkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/cards/{cardId}:
    get:
      tags: [cards]
      summary: Obter story card
      operationId: getCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [cards]
      summary: Atualizar story card (parcial)
      operationId: updateCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCardUpsert'
      responses:
        '200':
          description: Card atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [cards]
      summary: Remover story card
      operationId: deleteCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '204':
          description: Card removido.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/scene:
    post:
      tags: [assets]
      summary: Fundo e elenco da cena atual (enfileira a pintura se o lugar ou o clima mudou)
      operationId: syncScene
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                retry:
                  type: boolean
                  description: true força outra pintura mesmo com fundo já pronto.
      responses:
        '200':
          description: |
            Lugar, clima, elenco (retratos) e estado do fundo
            (none/pending/ready/error/disabled). Não bloqueia na geração.
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- assets
  # Pipeline assíncrono (v0.3.0): enfileira gerações; o worker (backend) executa
  # em background e a UI faz polling em GET .../jobs, aplicando cada asset ao
  # concluir. Criar aventura a partir de cenário já enfileira retratos dos NPCs.
  /api/adventures/{adventureId}/portraits:
    post:
      tags: [assets]
      summary: Enfileirar retrato só dos NPCs que ainda não têm foto (cards type=character)
      operationId: enqueueAllPortraits
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '202':
          description: Jobs enfileirados (dedupe — jobs ativos são reaproveitados).
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/{cardId}/portrait:
    post:
      tags: [assets]
      summary: (Re)gerar retrato de um NPC
      operationId: enqueuePortrait
      description: |
        Enfileira um job character_portrait. A primeira foto vira a âncora
        (portrait_anchor_id) e passa a ser a cara do NPC na cena, no dock e na ficha.
        Se o card já tem retrato, o job é img2img a partir desse PNG (o rosto não
        é sorteado de novo). Geração automática (cena, "gerar todos", nova aventura)
        não substitui um retrato existente. Se o card não tiver portrait_prompt,
        o LLM escreve um a partir de entry + contexto da aventura (e o persiste no
        card). Prompt final = image_style da aventura + portrait_prompt + style_suffix.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum: [anchor, reference]
                  default: anchor
                  description: |
                    reference gera o retrato só a partir da foto enviada
                    (sheet.reference). Sem foto, 422 reference_required.
      responses:
        '202':
          description: Job enfileirado (ou job ativo existente — dedupe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: source=reference sem foto de referência (reference_required).
    delete:
      tags: [assets]
      summary: Apagar o retrato e a âncora do NPC
      operationId: deletePortrait
      description: |
        Apaga as linhas de imagem do retrato e da âncora, e os PNGs que
        continuarem dentro do repositório. 204 mesmo se já não havia retrato.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '204':
          description: Retrato apagado, ou já não havia retrato.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/{cardId}/enrich:
    post:
      tags: [assets]
      summary: (v0.5.0) Enriquecer a ficha do NPC via LLM
      operationId: enrichCard
      description: |
        O LLM gera a ficha estruturada (appearance, body, clothing, personality,
        stats {str..cha 1-20}, notes) a partir de entry + contexto da aventura
        (melhorando uma ficha existente sem contradizê-la) e um portrait_prompt
        detalhado. Síncrono; persiste sheet (JSON string) e portrait_prompt no card.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card atualizado (sheet + portrait_prompt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Resposta do LLM não interpretável (generation_failed) — tente de novo.

  /api/adventures/{adventureId}/cards/{cardId}/regenerate:
    post:
      tags: [assets]
      summary: Regenerar um campo da ficha, ou os nove textos vivos
      operationId: regenerateCard
      description: |
        scope=field regenera um campo de REGENERABLE_FIELDS
        (personality, humor, speech, goals, background, lifestyle, habits,
        likes, sentiments, portrait_prompt). Campo fora da lista: 422 invalid_field.
        scope=all preenche só os vazios quando overwrite=false, e substitui os
        nove textos quando overwrite=true. Não toca entry, appearance, body,
        clothing, status, stats nem notes. portrait_prompt só entra em scope=field.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRegenerateRequest'
      responses:
        '200':
          description: Card e a lista do que mudou.
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/StoryCard'
                  regenerated:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: invalid_field
        '503':
          description: generation_failed

  /api/adventures/{adventureId}/cards/{cardId}/reference:
    put:
      tags: [assets]
      summary: Enviar uma foto de referência do personagem
      operationId: uploadReference
      description: |
        Multipart com file e mode. mode=reference (padrão) grava sheet.reference
        e não marca pessoa real. mode=real_person também marca real_person e
        espelha o caminho em likeness. Limpa portrait_anchor_id e mantém o
        retrato atual. Menor continua recusado.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [reference, real_person]
                  default: reference
      responses:
        '200':
          description: Card atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '400':
          description: Imagem inválida ou mode inválido.
        '422':
          description: Menor (minor).
    delete:
      tags: [assets]
      summary: Apagar a foto de referência
      operationId: deleteReference
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: sheet.reference e o caminho do likeness zerados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'

  /api/adventures/{adventureId}/cards/{cardId}/memories:
    get:
      tags: [assets]
      summary: Memórias recentes do NPC
      operationId: listNpcMemories
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Até 20 memórias, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items:
                      $ref: '#/components/schemas/NpcMemory'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/life/tick:
    post:
      tags: [adventures]
      summary: Enfileirar um dia fora de cena
      operationId: tickNpcLife
      description: Não roda o LLM no request. O worker executa npc_day_tick.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '202':
          description: Job enfileirado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/character:
    get:
      tags: [cards]
      summary: Ficha do personagem de quem está logado
      operationId: getPlayerCharacter
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Card do personagem do jogador (null se ainda não criou).
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    allOf:
                      - $ref: '#/components/schemas/StoryCard'
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [cards]
      summary: Criar ou atualizar o personagem de quem está logado
      description: |
        A ficha é normalizada: `class` é gravado pelo alias e as seis
        habilidades saem sempre preenchidas — números enviados são
        normalizados (1–20) e stats vazios são estimados pela classe,
        aparência e notas. Chaves extras (`hp`, por exemplo) seguem como vieram.
      operationId: putPlayerCharacter
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCharacterUpsert'
      responses:
        '200':
          description: Card salvo (id e retrato preservados).
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/characters:
    get:
      tags: [cards]
      summary: Personagens dos jogadores da mesa
      operationId: listPlayerCharacters
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Um card por jogador da mesa.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    card:
                      $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/consistency:
    get:
      tags: [consistency]
      summary: Auditar o cruzamento entre ficha, retrato, imagem, memória e embedding
      description: |
        Roda as verificações do projeto (ficha viva do NPC, prompt/portrait,
        memórias vetorizadas, mente do NPC, cânone do mundo e alinhamento entre a
        cena do feed e o fundo do painel) e devolve o relatório.
      operationId: getConsistency
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Relatório das verificações.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyReport'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/consistency/repair:
    post:
      tags: [consistency]
      summary: Reparar uma verificação quebrada
      description: Refaz fichas incompletas, prompts/retratos divergentes e memórias sem embedding.
      operationId: repairConsistency
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [check]
              properties:
                check:
                  type: string
                  enum: [card_sheets, portraits, memories]
                  description: Verificação a reparar (as demais são informativas).
      responses:
        '200':
          description: O que foi refeito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyRepair'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/jobs:
    get:
      tags: [assets]
      summary: Listar jobs da aventura (polling da UI)
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [preparing, pending, running, done, error, canceled]
      responses:
        '200':
          description: Fila em ordem de criação.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/jobs/{jobId}:
    get:
      tags: [assets]
      summary: Obter job
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [assets]
      summary: Cancelar job que ainda não roda (preparing ou pending)
      operationId: cancelJob
      description: Jobs running são devolvidos sem alteração (cancelamento cooperativo — v1); jobs finalizados dão 409 job_not_cancelable. Publica job_progress canceled.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job cancelado (ou running, sem alteração).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Job já finalizado (error.code = job_not_cancelable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{jobId}:
    get:
      tags: [assets]
      summary: Obter job pelo id (polling do See assíncrono, contrato C6)
      operationId: getJobById
      description: Job de história de outra pessoa responde 404, como um id que não existe.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- memory
  /api/adventures/{adventureId}/memory:
    get:
      tags: [memory]
      summary: Ler Plot Essentials + Author's Note
      operationId: getMemory
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Estado de memória editável (+ story_summary somente leitura).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryState'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [memory]
      summary: Gravar Plot Essentials + Author's Note
      operationId: putMemory
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdate'
      responses:
        '200':
          description: Memória atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryState'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/memories:
    get:
      tags: [memory]
      summary: Listar entradas individuais do Memory Bank
      operationId: listAdventureMemories
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Lista de memórias da aventura.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [memory]
      summary: Criar entrada no Memory Bank e gerar embedding
      operationId: createAdventureMemory
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreate'
      responses:
        '201':
          description: Memória criada e vetorizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/memories/{memoryId}:
    patch:
      tags: [memory]
      summary: Atualizar texto de memória e recalcular embedding
      operationId: patchAdventureMemory
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/MemoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryPatch'
      responses:
        '200':
          description: Memória atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [memory]
      summary: Excluir memória do Memory Bank
      operationId: deleteAdventureMemory
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '204':
          description: Memória excluída.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/memories/regenerate:
    post:
      tags: [memory]
      summary: Regenerar resumos e re-vetorizar todo o Memory Bank
      operationId: regenerateAdventureMemories
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Memory Bank reprocessado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRegenerateResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------ import/export
  /api/import/aidungeon:
    post:
      tags: [import-export]
      summary: Importar backup do AI Dungeon (.zip)
      operationId: importAidungeon
      description: |
        Recebe o `.zip` do backup oficial (multipart). O importador
        (PLANO.md §2.1/§4.6) lê `metadata.json` + `actions-*.json` (ordenados
        por `partNumber`), cria scenario implícito + aventura, e insere ações
        na ordem do array (`seq` 0..N), story cards (triggers = split/trim de
        `keys`) e memórias. Um JSON solto de story cards pode acompanhar o zip
        para merge/validação.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup .zip exportado do AI Dungeon.
      responses:
        '201':
          description: Importação concluída (relatório).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '400':
          description: Arquivo inválido ou formato não reconhecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/export:
    get:
      tags: [import-export]
      summary: Exportar aventura NO MESMO FORMATO do backup
      operationId: exportAdventure
      description: |
        Gera um `.zip` byte-compatível com o formato de backup do AI Dungeon
        (`metadata.json` + `actions-001.json`, ...), permitindo round-trip
        import → export → import.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Zip no formato de backup do AI Dungeon.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ settings
  /api/settings/llm:
    get:
      tags: [settings]
      summary: Ler configuração do servidor LLM
      operationId: getLlmSettings
      description: |
        Devolve a config efetiva (arquivo `config/settings.json` + overrides
        persistidos na tabela `settings` do banco). `api_key` nunca é devolvida
        em claro — vem mascarada (`"sk-…1234"`) ou `null`.
      responses:
        '200':
          description: Configuração atual do LLM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettings'
    put:
      tags: [settings]
      summary: Atualizar configuração do servidor LLM
      operationId: putLlmSettings
      description: |
        Persiste overrides na tabela `settings` (prevalecem sobre o arquivo).
        Campos omitidos permanecem. Após mudar `base_url`/`model_alias`, o
        backend refaz a descoberta de modelo (`GET {base_url}/models`).
        `api_key` é armazenada localmente e nunca exposta em logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada (com modelo redescoberto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettings'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------ assistant
  /api/assistant/generate:
    post:
      tags: [assistant]
      summary: Gerar o cenário inteiro, com fichas vivas quando pedido
      operationId: assistantGenerate
      description: |
        Mesmo rascunho de /assistant/scenario. current entra no prompt como
        o rascunho a regenerar. deep_characters=true chama a ficha completa
        de cada card type=character; o que o rascunho já tiver prevalece.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantGenerateRequest'
      responses:
        '200':
          description: Rascunho gerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDraft'
        '503':
          description: generation_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/scenario:
    post:
      tags: [assistant]
      summary: Gerar rascunho completo de cenário a partir de uma ideia
      operationId: assistantScenario
      description: |
        Recebe uma ideia em linguagem natural (`brief`, PT ou EN) e devolve um
        rascunho ESTRUTURADO completo (título, descrição, ai_instructions,
        plot_essentials, authors_note, opening_text, tags e story cards
        iniciais). NÃO persiste nada — o frontend revisa e depois chama
        POST /api/scenarios. Campos de texto narrativo são gerados em inglês
        (convenção do jogo); `brief` pode ser em qualquer idioma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantScenarioRequest'
      responses:
        '200':
          description: Rascunho gerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDraft'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/field:
    post:
      tags: [assistant]
      summary: Regenerar um campo do rascunho (ou sugerir story cards)
      operationId: assistantField
      description: |
        Regenera UM campo mantendo coerência com o resto do rascunho enviado.
        `field=story_cards` devolve array de cards (merge/substituição é
        decisão do frontend).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantFieldRequest'
      responses:
        '200':
          description: Campo regenerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantFieldResponse'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # -------------------------------------------------------------------- images
  /api/adventures/{adventureId}/see:
    post:
      tags: [images]
      summary: Gerar imagem da cena (ação "See")
      operationId: postSee
      description: |
        Fluxo: (1) o LLM resume a cena recente (até settings.image.prompt_builder
        .max_scene_chars) em um prompt de imagem EN, prefixado por
        adventures.image_style; (2) chama o provedor configurado
        (settings.image.provider: `sdwebui` → POST {base_url}/sdapi/v1/txt2img;
        `openai_compatible` → POST {base_url}/images/generations com Bearer);
        (3) salva o arquivo em settings.image.storage_dir/<adventure_id>/;
        (4) grava linha em `images` e uma action `type=see` (text = prompt
        resumido) vinculada pelo mesmo seq, no fim da aventura; (5) devolve a imagem.
        Sem lock de geração: o jogador age enquanto a imagem sai.
        Com `Prefer: respond-async` (ou `?async=1`) responde 202 {job_id} na
        hora e o resto vira o job `see_image` (contrato C6): resultado em
        `see_ready`/`see_failed` no SSE ou por polling em GET /api/jobs/{id}.
        Sem o header, resposta JSON síncrona (geração local pode levar
        minutos — o frontend mostra spinner). 503 se provider inalcançável.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
          description: '`respond-async` pede o 202.'
        - name: async
          in: query
          required: false
          schema:
            type: boolean
          description: 'Mesmo efeito do `Prefer: respond-async`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeeRequest'
      responses:
        '200':
          description: Imagem gerada e vinculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResult'
        '202':
          description: Job see_image criado em `preparing` (header Preference-Applied respond-async).
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Provedor de imagem indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/choices:
    post:
      tags: [generation]
      summary: Sugerir próximas ações para o jogador
      operationId: postChoices
      description: |
        Após ler a cena recente, o LLM sugere `settings.choices.count`
        (default 3) opções curtas de próxima ação — array JSON de
        {type: do|say|story, text ≤ 120 chars}, textos em inglês.
        Sem body. Quando `settings.choices.enabled=false` devolve
        200 {"choices": []}. Usa o mesmo lock por aventura da geração
        (action/continue/retry/see).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Opções sugeridas (ou lista vazia se desabilitado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoicesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração em andamento para a aventura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/ui-profile:
    get:
      tags: [ui-profile]
      summary: Ler manifesto de controles + estado dos widgets
      operationId: getUiProfile
      description: |
        Devolve o manifesto gerado pela IA (`profile`: tabs do InputBar +
        widgets dice/stats/inventory/character) e o estado atual dos widgets
        (`state`, editado pelo jogador). `profile: null` = aventura sem painel
        (não gerado ou `settings.ui_profile.enabled=false`).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Manifesto + estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UiProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ui-profile]
      summary: Gerar (ou redesenhar) o manifesto de controles via LLM
      operationId: postUiProfile
      description: |
        O LLM lê título, descrição, AI instructions, plot essentials, author's
        note e abertura da aventura e devolve o manifesto JSON do painel.
        A resposta é normalizada por whitelist (ids de tab fixos do/say/story;
        tipos de widget dice/stats/inventory/character; limites de tamanho) e
        persistida em `adventures.ui_profile`. Na primeira geração o estado
        inicial dos widgets (valores do LLM) é gravado em `ui_state` —
        gerações seguintes preservam o estado editado pelo jogador.
        `enabled=false` → 200 com `profile: null`. Usa o mesmo lock por
        aventura da geração (action/continue/retry/see/choices).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Manifesto gerado + estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UiProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração em andamento para a aventura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LLM indisponível ou resposta não parseável.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/ui-state:
    put:
      tags: [ui-profile]
      summary: Gravar estado dos widgets (edição do jogador)
      operationId: putUiState
      description: |
        Substitui `adventures.ui_state` (HP, inventário, ficha). O frontend
        envia com debounce de ~600 ms a cada edição. Limite de 16 KB
        serializados. O estado entra no contexto do LLM como bloco
        `[Player state]` na próxima geração.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UiStateUpdate'
      responses:
        '200':
          description: Estado gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UiStateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Estado excede 16 KB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/images/{imageId}:
    get:
      tags: [images]
      summary: Servir arquivo de imagem gerado
      operationId: getImage
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Arquivo da imagem.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/settings/image:
    get:
      tags: [settings]
      summary: Ler configuração de geração de imagens
      operationId: getImageSettings
      responses:
        '200':
          description: Config efetiva (api_key mascarada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSettings'
    put:
      tags: [settings]
      summary: Atualizar configuração de geração de imagens
      operationId: putImageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSettings'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------- voice
  /api/voices:
    get:
      tags: [voice]
      summary: Listar vozes TTS disponíveis + voz do narrador
      operationId: listVoices
      responses:
        '200':
          description: Vozes da config efetiva (settings.voice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceList'

  /api/tts:
    post:
      tags: [voice]
      summary: Sintetizar texto em áudio (mp3)
      operationId: postTts
      description: |
        Chama `POST {voice.base_url}/audio/speech` (Supertonic, formato OpenAI
        TTS) e devolve os bytes em passthrough. `voice` omitida (null) usa
        `narrator_voice` da config. `emotion` é dica; a linha vence e, sem
        palavra de emoção, vale a ficha do NPC citado em `adventure_id`.
        A emoção escolhida volta no header `X-Voice-Emotion` e no campo
        `instructions` do provider. Com `drama3_enabled` falso o texto falado
        continua limpo (Supertonic). Validações: `voice_disabled` (400),
        `invalid_payload` (texto vazio, 400), `text_too_long` (acima de
        max_text_chars, 400), `invalid_voice` (fora da lista ou '', 400).
        Provider indisponível → 502 (`unreachable`/`auth_error`/`error`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: Áudio sintetizado (bytes mp3, NÃO JSON).
          headers:
            X-Voice-Emotion:
              description: Emoção escolhida (joy, anger, fear, sadness, tenderness, surprise, disgust, neutral).
              schema:
                type: string
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Validação (voice_disabled/invalid_payload/text_too_long/invalid_voice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider de voz indisponível ou erro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stt:
    post:
      tags: [voice]
      summary: Transcrever áudio (Whisper)
      operationId: postStt
      description: |
        Multipart campo `file` (webm/ogg/mp3/wav/m4a). Repassa ao provider
        `POST {voice.base_url}/audio/transcriptions` com model=stt_model e
        devolve `{"text": ...}` (formato OpenAI whisper). Validações:
        arquivo ausente → 400 `invalid_payload`; Content-Length acima de
        stt_max_bytes → 413 `audio_too_large`; enabled=false → 400
        `voice_disabled`. Provider → 502 como no /tts.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de áudio (webm/ogg/mp3/wav/m4a).
      responses:
        '200':
          description: Transcrição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttResult'
        '400':
          description: Arquivo ausente ou voz desabilitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Áudio acima de stt_max_bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider de voz indisponível ou erro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/voice:
    get:
      tags: [voice]
      summary: Ler configuração de voz (TTS/STT)
      operationId: getVoiceSettings
      responses:
        '200':
          description: Config efetiva (api_key mascarada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettings'
    put:
      tags: [voice]
      summary: Atualizar configuração de voz (TTS/STT)
      operationId: putVoiceSettings
      description: narrator_voice fora da lista → 400 invalid_voice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettings'
        '400':
          description: narrator_voice inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------- health
  /api/health/llm:
    get:
      tags: [health]
      summary: Status do servidor LLM, scheduler, slots, fila de jobs e memória
      operationId: healthLlm
      description: |
        Sonda `GET {base_url}/models` em tempo real: confirma alcance, auth e
        devolve o modelo que será usado na geração (descoberta automática
        quando `model_alias = "auto"`).

        Também traz, sem cache (VRAM: 5 s), o estado do scheduler (breaker,
        fila, slots ocupados), o slot de cada role, o `status.json` do
        slot_watchdog, a fila de jobs, RAM/swap/VRAM e TTFT/tok/s das últimas
        narrativas. Com o servidor respondendo, `status` vira `degraded`
        quando o breaker está aberto ou o watchdog vê `/slots` sem resposta
        ou um slot ocupado sem progresso há 30 s ou mais.
      responses:
        '200':
          description: Sempre 200; o campo `status` informa a saúde do LLM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmHealth'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token devolvido por POST /api/auth/login (HMAC-SHA256, TTL de settings.auth.token_ttl_hours).

  parameters:
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
    AdventureId:
      name: adventureId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: integer
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    MemoryId:
      name: memoryId
      in: path
      required: true
      description: ID numérico da memória individual.
      schema:
        type: integer

  responses:
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente/inválido/expirado, ou credenciais inválidas no login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Payload inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ------------------------------------------------------------------ auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Bearer token (formato base64url(user).base64url(exp).assinatura_hex).
        expires_at:
          type: string
          format: date-time


    # ------------------------------------------------------------- entities
    Scenario:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          description: UUID.
        title:
          type: string
        description:
          type: string
          default: ''
        ai_instructions:
          type: string
          default: ''
          description: Prompt/instruções de estilo do scenario (bloco 1 do sanduíche).
        plot_essentials:
          type: string
          default: ''
          description: '"Memory" fixo: quem é você, mundo, regras (bloco 2).'
        authors_note:
          type: string
          default: ''
          description: Nota de estilo injetada perto do fim do contexto (bloco 7).
        opening_text:
          type: string
          default: ''
          description: Texto de abertura — vira a action `start` da aventura.
        tags:
          type: array
          items:
            type: string
          default: []
        story_cards:
          type: array
          default: []
          description: Cards iniciais do rascunho do assistente (v2) — herdados como story_cards da aventura criada a partir deste scenario.
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
        third_person:
          type: boolean
          default: false
          description: Narração em 3ª pessoa (padrão AI Dungeon é 2ª pessoa).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScenarioCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        ai_instructions:
          type: string
        plot_essentials:
          type: string
        authors_note:
          type: string
        opening_text:
          type: string
        tags:
          type: array
          items:
            type: string
        story_cards:
          type: array
          description: Opcional (v2) — cards do rascunho revisado do assistente; persistidos no scenario e herdados pela aventura.
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
        third_person:
          type: boolean
          default: false

    Adventure:
      type: object
      required: [id, title, source]
      properties:
        id:
          type: string
          description: UUID.
        scenario_id:
          type: string
          nullable: true
          description: Scenario de origem (null em aventuras importadas/vazias sem vínculo).
        title:
          type: string
        description:
          type: string
          default: ''
        ai_instructions:
          type: string
          default: ''
        plot_essentials:
          type: string
          default: ''
        authors_note:
          type: string
          default: ''
        story_summary:
          type: string
          default: ''
          description: Resumo rolante (bloco 5), mantido pelo summarizer.
        image_style:
          type: string
          default: ''
          description: Prefixo de estilo visual para o prompt_builder de imagens (state.imageStyle no backup).
        tags:
          type: array
          items:
            type: string
          default: []
        third_person:
          type: boolean
          default: false
        source:
          type: string
          enum: [new, import]
          default: new
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdventureCreate:
      type: object
      properties:
        scenario_id:
          type: string
          nullable: true
          description: Se presente, herda campos do scenario e cria a action `start`.
        title:
          type: string
          description: Sobrescreve o título herdado do scenario.
        tags:
          type: array
          items:
            type: string

    AdventureSummary:
      type: object
      description: Card da home.
      required: [id, title, source]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [new, import]
        action_count:
          type: integer
        last_excerpt:
          type: string
          description: Último trecho da história (preview no card).
        updated_at:
          type: string
          format: date-time

    AdventureState:
      allOf:
        - $ref: '#/components/schemas/Adventure'
        - type: object
          properties:
            actions:
              type: array
              description: Histórico completo, ordenado por `seq`.
              items:
                $ref: '#/components/schemas/Action'
            story_cards:
              type: array
              items:
                $ref: '#/components/schemas/StoryCard'
            memories:
              type: array
              items:
                $ref: '#/components/schemas/Memory'
            consistency:
              nullable: true
              description: |
                Relatório da auditoria (C9). Só vem no `POST /api/adventures`
                quando a aventura nasce de um scenario: as fichas determinísticas
                já saem preenchidas (status, classe, atributos) e o resto fica
                para o reparo da aba Check.
              allOf:
                - $ref: '#/components/schemas/ConsistencyReport'

    Action:
      type: object
      required: [id, adventure_id, seq, type, text]
      properties:
        id:
          type: integer
          description: PK autoincrement (não confundir com o id do backup).
        adventure_id:
          type: string
        seq:
          type: integer
          description: Ordem absoluta dentro da aventura (0..N, sem buracos).
        type:
          type: string
          enum: [start, continue, do, say, story, see]
          description: |
            `start` abertura · `do` ação física · `say` fala · `story` narração
            injetada · `continue` resposta da IA · `see` imagem (fase opcional).
        text:
          type: string
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: object
          nullable: true
          description: Presente em actions type=see — imagem vinculada.
          properties:
            id:
              type: string
            url:
              type: string
            prompt:
              type: string

    ActionRequest:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [do, say, story]
          description: Tipos que o jogador pode enviar.
        text:
          type: string
          minLength: 1

    ActionPatch:
      type: object
      required: [text]
      properties:
        text:
          type: string

    UndoResult:
      type: object
      properties:
        removed:
          type: array
          items:
            $ref: '#/components/schemas/Action'
          description: Ações removidas (resposta da IA + ação do jogador, se houve).
        last_action:
          $ref: '#/components/schemas/Action'
        action_count:
          type: integer

    StoryCard:
      type: object
      required: [id, adventure_id]
      properties:
        id:
          type: string
          description: UUID.
        adventure_id:
          type: string
        title:
          type: string
          default: ''
        type:
          type: string
          default: other
          description: Categoria livre (ex. location, character, item, faction, concept).
        triggers:
          type: array
          items:
            type: string
          default: []
          description: Palavras-chave (case-insensitive) que injetam o card no contexto.
        entry:
          type: string
          default: ''
          description: Texto injetado quando um trigger dispara (ou sempre, se pinned).
        pinned:
          type: boolean
          default: false
          description: Pinned = sempre presente no contexto.
        use_for_character_creation:
          type: boolean
          default: false
        portrait_image_id:
          type: string
          nullable: true
          description: v0.3.0 — id da imagem de retrato que a UI mostra (definido pelo job character_portrait; não editável via PATCH).
        portrait_anchor_id:
          type: string
          nullable: true
          description: Primeira foto do NPC. Regenerar retrato faz img2img a partir deste arquivo, para manter o mesmo rosto. Não editável via PATCH.
        portrait_prompt:
          type: string
          default: ''
          description: v0.3.0 — prompt do retrato; se vazio, o LLM escreve um a partir de entry + contexto da aventura (e persiste aqui).
        voice:
          type: string
          default: ''
          description: v0.3.0 — voz TTS do NPC ('', M1, M2, M3, F1, F2, F3 — Supertonic).
        vrm_id:
          type: string
          default: ''
          description: Config do avatar 3D do NPC (JSON de serializeAvatarConfig —
            modelo GLB/corpo/mood do TalkingHead; nome da coluna mantido por
            compatibilidade de schema).
        sheet:
          type: string
          default: ''
          description: |
            Ficha estruturada do NPC como JSON string ('' = sem ficha).
            Textos: appearance, body, clothing, personality, humor, speech,
            goals, background, lifestyle, habits, likes, sentiments (até 240),
            notes. stats: {str, dex, con, int, wis, cha (1-20)}.
            life: {mood, activity, day, last_tick}.
            reference: {image_path, source, mode, created_at}.
            O narrador lê esses campos via card_canon_text.
        portrait:
          type: object
          nullable: true
          description: v0.3.0 — retrato atual do NPC (mesmo recorte de Action.image).
          properties:
            id:
              type: string
            url:
              type: string
            prompt:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoryCardUpsert:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        triggers:
          type: array
          items:
            type: string
        entry:
          type: string
        pinned:
          type: boolean
        use_for_character_creation:
          type: boolean
        portrait_prompt:
          type: string
        voice:
          type: string
        vrm_id:
          type: string
        sheet:
          type: object
          description: v0.5.0 — ficha estruturada (dict no body; persistida como JSON string).

    CardBulkAction:
      type: object
      required:
        - action
        - card_ids
      properties:
        action:
          type: string
          enum: [delete, pin, unpin, retype]
          description: Operação a ser executada em lote
        card_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Lista de IDs dos story cards a modificar
        new_type:
          type: string
          description: Novo tipo do card (obrigatório se action=retype)

    CardBulkResponse:
      type: object
      required:
        - updated
        - action
      properties:
        updated:
          type: integer
          description: Quantidade de cards afetados pela operação
        action:
          type: string
          description: Ação executada

    Job:
      type: object
      description: Job do pipeline assíncrono de assets (v0.3.0; prioridade e See no contrato C5/C6).
      required: [id, adventure_id, type, status]
      properties:
        id:
          type: string
        adventure_id:
          type: string
        type:
          type: string
          enum: [character_portrait, scene_backdrop, see_image, npc_day_tick, card_assets]
        status:
          type: string
          enum: [preparing, pending, running, done, error, canceled]
          description: '`preparing` só no see_image, enquanto o LLM escreve o prompt.'
        ref_id:
          type: string
          description: Alvo do job (character_portrait → id do story card; scene_backdrop → "<adventure_id>:<assinatura>").
        payload:
          type: object
        priority:
          type: integer
          description: Menor roda antes — 0 see_image, 1 retrato de NPC presente, 2 scene_backdrop, 3 retratos em lote, 4 dia de vida do NPC, 5 card_assets (ficha viva via LLM).
        supersede_key:
          type: string
          description: Job novo com a mesma chave cancela os que ainda não rodam (fundo usa "backdrop:<adventure_id>").
        result:
          type: object
          nullable: true
          description: 'done → character_portrait {"image": {id, url, prompt}, "card_id", "prompt"}; scene_backdrop {"image", "ref_id"}; see_image {"image": ImageResult}; card_assets {"card_id", "filled", "remaining"}. error → {"code"}.'
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    Memory:
      type: object
      description: Entrada do Memory Bank (resumo automático de eventos antigos).
      required: [id, adventure_id, text]
      properties:
        id:
          type: integer
        adventure_id:
          type: string
        text:
          type: string
        seq_start:
          type: integer
          nullable: true
          description: Primeiro `seq` coberto pelo resumo.
        seq_end:
          type: integer
          nullable: true
          description: Último `seq` coberto pelo resumo.
        created_at:
          type: string
          format: date-time

    MemoryState:
      type: object
      properties:
        plot_essentials:
          type: string
        authors_note:
          type: string
        story_summary:
          type: string
          readOnly: true
          description: Mantido automaticamente pelo summarizer (não editável aqui).
        memories:
          type: array
          readOnly: true
          description: Memory bank arquivado (trechos que saíram da janela).
          items:
            $ref: '#/components/schemas/Memory'

    MemoryUpdate:
      type: object
      properties:
        plot_essentials:
          type: string
        authors_note:
          type: string

    MemoryCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: Texto do fato a ser lembrado.
        seq_start:
          type: integer
          nullable: true
          description: Primeiro seq coberto.
        seq_end:
          type: integer
          nullable: true
          description: Último seq coberto.

    MemoryPatch:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          description: Novo texto do fato (recalcula embedding se fornecido).
        seq_start:
          type: integer
          nullable: true
        seq_end:
          type: integer
          nullable: true

    MemoryRegenerateResponse:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
          example: regenerated
        count:
          type: integer
          example: 5

    ImportReport:
      type: object
      properties:
        adventure_id:
          type: string
        title:
          type: string
        actions_imported:
          type: integer
        cards_imported:
          type: integer
        memories_imported:
          type: integer
        warnings:
          type: array
          items:
            type: string
          description: Divergências não fatais (ex. card sem título, id fora de sequência).

    LlmSettings:
      type: object
      description: Área de configuração do servidor LLM (config/settings.json + overrides do banco).
      properties:
        provider:
          type: string
          example: llamacpp
        base_url:
          type: string
          example: http://vm.groupabz.com:1234/v1
        api_key:
          type: string
          nullable: true
          example: "sk-…9f2a"
          description: Sempre mascarada nas respostas.
        model_alias:
          type: string
          example: auto
          description: '"auto" = descobre via GET {base_url}/models; ou id explícito do modelo.'
        model_discovered:
          type: string
          nullable: true
          example: Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ2_M.gguf
          description: Modelo que será usado de fato na geração (preenchido pela descoberta).
        context_size:
          type: integer
          example: 8192
          description: Janela total de contexto; a janela recente absorve a diferença (regra em settings.json).
        max_tokens:
          type: integer
          example: 300
          description: Tamanho máximo da resposta da IA (slider 100–600 na UI).
        streaming:
          type: boolean
          default: true
        disable_thinking:
          type: boolean
          default: true
          description: Envia chat_template_kwargs.enable_thinking=false (obrigatório p/ modelos Qwen3.x híbridos; senão content volta vazio).
        timeout_seconds:
          type: integer
          example: 180
        temperature:
          type: number
          example: 0.85
          description: Sampler efetivo (override sampler.temperature > settings.json sampler).
        top_p:
          type: number
          example: 0.95
        repetition_penalty:
          type: number
          example: 1.08

    LlmSettingsUpdate:
      type: object
      description: Todos os campos opcionais; omitidos permanecem.
      properties:
        base_url:
          type: string
        api_key:
          type: string
          nullable: true
          description: Enviar string vazia remove a chave; omitir mantém.
        model_alias:
          type: string
        context_size:
          type: integer
          minimum: 4096
          maximum: 131072
        max_tokens:
          type: integer
          minimum: 100
          maximum: 600
        streaming:
          type: boolean
        disable_thinking:
          type: boolean
        timeout_seconds:
          type: integer
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
          description: Persistido como override sampler.temperature.
        top_p:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Persistido como override sampler.top_p.
        repetition_penalty:
          type: number
          minimum: 1.0
          maximum: 2.0
          description: Persistido como override sampler.repetition_penalty.

    LlmHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unreachable, auth_error, error]
        provider:
          type: string
          example: llamacpp
        base_url:
          type: string
          example: http://vm.groupabz.com:1234/v1
        model_alias:
          type: string
          example: auto
        model_discovered:
          type: string
          nullable: true
          example: Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ2_M.gguf
        model_loaded:
          type: boolean
        details:
          type: string
          nullable: true
          description: Mensagem de erro, motivo do `degraded` ou informação extra do runtime.
        scheduler:
          type: object
          description: Snapshot do llm_scheduler.
          properties:
            breaker:
              type: object
              properties:
                state:
                  type: string
                  enum: [closed, open, half_open]
                failures:
                  type: integer
                until:
                  type: string
                  nullable: true
                  description: Fim do breaker aberto (ISO UTC); null fora de `open`.
            narratives:
              type: integer
            aux_in_flight:
              type: integer
            aux_cap:
              type: integer
            busy_slots:
              type: array
              items:
                type: integer
            reserved_slots:
              type: array
              items:
                type: integer
              description: Slots tomados pelo fallback da narrativa.
            waiting:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                  slot:
                    type: integer
                    nullable: true
                  waited_s:
                    type: number
        slots:
          type: object
          properties:
            total:
              type: integer
              nullable: true
              description: total_slots de /props; null com o servidor fora do ar.
            roles:
              type: object
              additionalProperties:
                type: integer
                nullable: true
              example: {narrative: 0, choices: 1, chronicle: 2, summary: 2, image_prompt: 3, assistant: 3, meta: 3}
            watchdog:
              type: object
              nullable: true
              description: |
                `status.json` do slot_watchdog (`scheduler.watchdog_status_path`)
                mais `age_s` e `stale` (sem leitura há mais de 60 s); null sem o arquivo.
              properties:
                checked_at:
                  type: string
                age_s:
                  type: number
                  nullable: true
                stale:
                  type: boolean
                slots:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      busy:
                        type: boolean
                      stalled_s:
                        type: number
                unreachable_s:
                  type: number
                restarts:
                  type: integer
                last_restart:
                  type: object
                  nullable: true
                hint:
                  type: object
                  nullable: true
        jobs:
          type: object
          description: 'Jobs ativos por status e tipo (`{tipo: quantidade}`).'
          properties:
            preparing:
              type: object
              additionalProperties:
                type: integer
            pending:
              type: object
              additionalProperties:
                type: integer
            running:
              type: object
              additionalProperties:
                type: integer
            oldest_pending_s:
              type: number
              nullable: true
        memory:
          type: object
          description: /proc/meminfo e nvidia-smi; campos ausentes quando a fonte não existe.
          properties:
            ram_total_mb:
              type: integer
            ram_available_mb:
              type: integer
            swap_total_mb:
              type: integer
            swap_used_mb:
              type: integer
            vram_used_mb:
              type: integer
            vram_total_mb:
              type: integer
        narrative:
          type: object
          description: Últimas 20 narrativas ok e a última narrativa (qualquer outcome).
          properties:
            samples:
              type: integer
            ttft_p50_s:
              type: number
              nullable: true
            ttft_p95_s:
              type: number
              nullable: true
            tok_s_p50:
              type: number
              nullable: true
            last:
              type: object
              nullable: true
              description: role, slot, outcome, at, total_s, waited_s, ttft_s, prompt_n, cache_n, predicted_n, prompt_per_second, predicted_per_second, fallback.

    SseStream:
      type: string
      description: |
        Fluxo `text/event-stream`. Eventos possíveis:
        - `token`: `data: {"token": "<trecho>"}` — um por token gerado;
        - `done`:  `data: {"player_action"?: {Action}, "action": {Action}}` —
          fim da geração, com a(s) action(s) persistida(s);
        - `error`: `data: {"message": "<motivo>"}` — falha; o stream encerra.
          Resposta que fica sem prosa depois da limpeza (só blocos de contexto
          copiados pelo narrador) também vira `error`, sem gravar o `continue`.

    # ------------------------------------------------------- v2: assistant/images
    ChoicesResponse:
      type: object
      required: [choices]
      properties:
        choices:
          type: array
          description: Exatamente settings.choices.count itens (default 3); vazio quando desabilitado.
          items:
            type: object
            required: [type, text]
            properties:
              type:
                type: string
                enum: [do, say, story]
              text:
                type: string
                maxLength: 120
                description: Sugestão curta em inglês.

    # ------------------------------------------------------- v0.7.0: ui-profile
    UiTab:
      type: object
      required: [id, label, placeholder]
      properties:
        id:
          type: string
          enum: [do, say, story]
          description: Fixo (constraint do banco); só label/placeholder mudam.
        label:
          type: string
          maxLength: 12
        placeholder:
          type: string
          maxLength: 60

    UiWidget:
      type: object
      required: [id, type, label]
      description: |
        Widget do painel (whitelist, máx. 6). Campos por tipo:
        - `dice`: `dice` (lados permitidos: 4, 6, 8, 10, 12, 20, 100);
        - `stats`: `stats` [{name, value, max?, min?}], máx. 8;
        - `inventory`: `items` [{name, qty}], máx. 24 (inicial vazio é válido);
        - `character`: `fields` [{name, value}], máx. 12.
      properties:
        id:
          type: string
          maxLength: 24
        type:
          type: string
          enum: [dice, stats, inventory, character]
        label:
          type: string
          maxLength: 24
        dice:
          type: array
          items: {type: integer, enum: [4, 6, 8, 10, 12, 20, 100]}
        stats:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: {type: string, maxLength: 24}
              value: {type: integer}
              max: {type: integer, nullable: true}
              min: {type: integer, nullable: true}
        items:
          type: array
          items:
            type: object
            required: [name, qty]
            properties:
              name: {type: string, maxLength: 24}
              qty: {type: integer, minimum: 1}
        fields:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: {type: string, maxLength: 24}
              value: {type: string, maxLength: 120}

    UiProfile:
      type: object
      required: [tabs, widgets]
      properties:
        tabs:
          type: array
          description: Sempre as 3 tabs (do/say/story), na ordem fixa.
          items:
            $ref: '#/components/schemas/UiTab'
        widgets:
          type: array
          description: Vazio = só o InputBar, sem painel.
          items:
            $ref: '#/components/schemas/UiWidget'

    UiProfileResponse:
      type: object
      required: [profile, state]
      properties:
        profile:
          nullable: true
          $ref: '#/components/schemas/UiProfile'
        state:
          type: object
          description: Estado dos widgets por widget id (chaves `stats`/`items`/`fields`/`dice`).

    UiStateUpdate:
      type: object
      required: [state]
      properties:
        state:
          type: object
          description: Objeto livre, máx. 16 KB serializado.

    UiStateResponse:
      type: object
      required: [state]
      properties:
        state:
          type: object

    CardRegenerateRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [all, field]
        field:
          type: string
        overwrite:
          type: boolean
          default: false

    NpcMemory:
      type: object
      properties:
        id:
          type: string
        adventure_id:
          type: string
        card_id:
          type: string
        kind:
          type: string
          enum: [event, reflection]
        text:
          type: string
        mood:
          type: string
        created_at:
          type: string

    AssistantGenerateRequest:
      type: object
      required: [brief]
      properties:
        brief:
          type: string
          minLength: 3
        current:
          type: object
          nullable: true
          description: Rascunho atual a regenerar.
        language:
          type: string
          default: en
        genre:
          type: string
          default: ''
        tone:
          type: string
          default: ''
        pov:
          type: string
          enum: [second, third, first]
          nullable: true
        protagonist_name:
          type: string
          default: ''
        protagonist_role:
          type: string
          default: ''
        protagonist_appearance:
          type: string
          default: ''
        image_style:
          type: string
          default: ''
        card_count:
          type: integer
          minimum: 3
          maximum: 8
          default: 5
        web_search_mode:
          type: string
          enum: [auto, always, off]
          default: auto
        deep_characters:
          type: boolean
          default: true

    AssistantScenarioRequest:
      type: object
      required: [brief]
      properties:
        brief:
          type: string
          minLength: 3
          description: Ideia em linguagem natural (qualquer idioma). Ex. "pirata steampunk caçando um leviatã".
        language:
          type: string
          default: en
          description: Idioma dos textos gerados (padrão en, convenção do jogo).

    ScenarioDraft:
      type: object
      description: Rascunho estruturado de cenário (não persistido — revisar e depois POST /api/scenarios).
      properties:
        title:
          type: string
        description:
          type: string
        ai_instructions:
          type: string
        plot_essentials:
          type: string
          description: "Ficha do protagonista + premissa (formato '[Name: ...]' como o backup real)."
        authors_note:
          type: string
        opening_text:
          type: string
          description: Abertura em 2ª pessoa — vira a action start.
        tags:
          type: array
          items:
            type: string
        story_cards:
          type: array
          description: 3–8 cards iniciais (NPCs, locais, facções) com triggers coerentes.
          items:
            $ref: '#/components/schemas/StoryCardUpsert'

    AssistantFieldRequest:
      type: object
      required: [field]
      properties:
        field:
          type: string
          enum: [title, description, ai_instructions, plot_essentials, authors_note, opening_text, tags, story_cards]
        brief:
          type: string
          description: Ideia original (contexto primário).
        current:
          type: string
          description: Valor atual do campo (para regenerar mantendo direção).
        draft:
          $ref: '#/components/schemas/ScenarioDraft'
          description: Rascunho atual completo (coerência cruzada).

    AssistantFieldResponse:
      type: object
      properties:
        field:
          type: string
        value:
          type: string
          description: Presente para campos de texto; tags vem como string separada por vírgula.
        story_cards:
          type: array
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
          description: Presente quando field=story_cards.

    SeeRequest:
      type: object
      required: [action_seq]
      properties:
        action_seq:
          type: integer
          description: Seq da ação cuja cena será ilustrada (normalmente a última continue).
        extra_prompt:
          type: string
          description: Detalhe extra do jogador para a imagem (opcional).

    ImageResult:
      type: object
      required: [id, url, prompt]
      properties:
        id:
          type: string
        url:
          type: string
          description: /api/images/{id} — servir com Bearer.
        prompt:
          type: string
          description: Prompt final enviado ao provedor (após prompt_builder).
        provider:
          type: string
        action:
          $ref: '#/components/schemas/Action'
          description: A action type=see persistida e vinculada.

    ImageSettings:
      type: object
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [sdwebui, openai_compatible]
        sdwebui_base_url:
          type: string
          example: http://127.0.0.1:7860
        sdwebui_steps:
          type: integer
        sdwebui_width:
          type: integer
        sdwebui_height:
          type: integer
        negative_prompt:
          type: string
        openai_base_url:
          type: string
        openai_api_key:
          type: string
          nullable: true
          description: Sempre mascarada.
        openai_model:
          type: string
        openai_size:
          type: string
          example: 512x512
        style_suffix:
          type: string

    ImageSettingsUpdate:
      type: object
      description: Campos omitidos permanecem.
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [sdwebui, openai_compatible]
        sdwebui_base_url:
          type: string
        sdwebui_steps:
          type: integer
        sdwebui_width:
          type: integer
        sdwebui_height:
          type: integer
        negative_prompt:
          type: string
        openai_base_url:
          type: string
        openai_api_key:
          type: string
          nullable: true
          description: String vazia remove; omitir mantém.
        openai_model:
          type: string
        openai_size:
          type: string
        style_suffix:
          type: string

    VoiceList:
      type: object
      properties:
        voices:
          type: array
          items:
            type: string
          example: [M1, M2, M3, F1, F2, F3]
        narrator_voice:
          type: string
          example: M1

    TtsRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Texto a sintetizar (até max_text_chars).
        voice:
          type: string
          nullable: true
          description: Voz TTS (M1–M3, F1–F3); omitida usa narrator_voice.
        emotion:
          type: string
          nullable: true
          description: >
            Dica de emoção (joy, anger, fear, sadness, tenderness, surprise,
            disgust, neutral; apelidos happy/sad/angry/love também). A linha
            vence. Omitida, o servidor escolhe.
        adventure_id:
          type: string
          nullable: true
          description: >
            Se a linha não declara emoção, a ficha do NPC citado nesta
            aventura entra na escolha. Id desconhecido é ignorado.

    SttResult:
      type: object
      properties:
        text:
          type: string
          description: Transcrição do áudio (formato OpenAI whisper).

    VoiceSettings:
      type: object
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
          example: https://vm.groupabz.com/voice/v1
        tts_model:
          type: string
          example: supertonic-3
        stt_model:
          type: string
          example: whisper-1
        narrator_voice:
          type: string
          example: M1
        voices:
          type: array
          items:
            type: string
        timeout_seconds:
          type: integer
        max_text_chars:
          type: integer
        stt_max_bytes:
          type: integer
        api_key:
          type: string
          nullable: true
          description: Sempre mascarada.
        api_key_set:
          type: boolean
          description: true se há chave efetiva (override ou env VOICE_API_KEY).
        drama3_model:
          type: string
          example: drama-3
        drama3_enabled:
          type: boolean
          description: >
            false nesta VM: o Drama-3 não cabe na L4 junto com o narrador
            e o gerador de imagem. A fala segue no tts_model.

    VoiceSettingsUpdate:
      type: object
      description: Campos omitidos permanecem.
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
        tts_model:
          type: string
        stt_model:
          type: string
        narrator_voice:
          type: string
          description: Fora da lista voices → 400 invalid_voice.
        timeout_seconds:
          type: integer
        api_key:
          type: string
          nullable: true
          description: String vazia remove; omitir mantém.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: adventure 3f2a... not found

    CharacterSheet:
      type: object
      description: |
        Ficha do personagem. `class` é a classe/arquétipo (alias do campo
        interno `class_`); `stats` traz as seis habilidades e aceita chaves
        extras. O backend completa o que faltar: status, stats estimados pela
        classe/apresentação/notas e a classe a partir do texto.
      properties:
        appearance:
          type: string
        body:
          type: string
        clothing:
          type: string
        status:
          type: string
        class:
          type: string
          example: Ladino
        notes:
          type: string
        stats:
          type: object
          description: str/dex/con/int/wis/cha em 1–20 + chaves extras livres.
          additionalProperties: true
          example: {str: 12, dex: 15, con: 12, int: 10, wis: 11, cha: 13}

    PlayerCharacterUpsert:
      type: object
      required: [title, sheet]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        sheet:
          $ref: '#/components/schemas/CharacterSheet'
        portrait_prompt:
          type: string
          nullable: true

    ConsistencyCheck:
      type: object
      required: [id, name, status, detail, items]
      properties:
        id:
          type: string
          enum: [card_sheets, portraits, memories, npc_minds, canon_world, scene_alignment]
        name:
          type: string
          example: Fichas dos NPCs
        status:
          type: string
          enum: [ok, warn, error]
        detail:
          type: string
        items:
          type: array
          items:
            type: object
            description: Item quebrado (o formato varia por verificação).
            additionalProperties: true

    ConsistencyReport:
      type: object
      required: [ok, adventure_id, checks, counts]
      properties:
        ok:
          type: boolean
          description: true quando nenhuma verificação está em warn/error.
        adventure_id:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ConsistencyCheck'
        counts:
          type: object
          properties:
            ok:
              type: integer
            warn:
              type: integer
            error:
              type: integer

    ConsistencyRepair:
      type: object
      required: [check, repaired, errors]
      properties:
        check:
          type: string
          enum: [card_sheets, portraits, memories]
        repaired:
          type: array
          description: Itens refeitos.
          items:
            type: object
            additionalProperties: true
        errors:
          type: array
          description: Itens que não puderam ser reparados.
          items:
            type: string
