          properties:
            resolution:
              type: object
              properties:
                steps:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                changes:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                time:
                  type: object
                  nullable: true
                  additionalProperties: true

    QuestStatus:
      type: string
      enum: [hidden, planned, available, accepted, completed, failed]

    QuestStage:
      type: object
      required: [title]
      properties:
        id:
          type: string
          default: ''
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
          default: ''
        done:
          type: boolean
          default: false

    Quest:
      type: object
      required: [id, title, status, stages, progress]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/QuestStatus'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/QuestStage'
        progress:
          type: object
          properties:
            value:
              type: integer
            target:
              type: integer
              nullable: true

    QuestCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          default: ''
        status:
          $ref: '#/components/schemas/QuestStatus'
        stages:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/QuestStage'
        progress_target:
          type: integer
          minimum: 1
          maximum: 999
          nullable: true
        triggers:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/QuestTriggerIn'

    QuestPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/QuestStatus'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/QuestStage'
        progress_target:
          type: integer
          minimum: 1
          maximum: 999

    QuestTransition:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/QuestStatus'
        stage_id:
          type: string
        done:
          type: boolean
        progress:
          type: integer
          minimum: 0
          maximum: 999

    QuestTriggerClause:
      type: object
      required: [fact]
      properties:
        fact:
          type: string
          enum: [hp, gold, san, resource, item, location, relation]
        op:
          type: string
          enum: [eq, ne, lt, lte, gt, gte]
          nullable: true
        value:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 80
        qty:
          type: integer
          minimum: 0
          maximum: 999
        title:
          type: string
          maxLength: 120
        place:
          type: string
          maxLength: 80
        card_id:
          type: string
          maxLength: 80
        location_id:
          type: string
          maxLength: 80
        a:
          type: string
          maxLength: 80
        b:
          type: string
          maxLength: 80
        stat:
          type: string
          maxLength: 40
        other_id:
          type: string
          maxLength: 80

    QuestTriggerEffect:
      type: object
      properties:
        quest_id:
          type: string
          default: ''
        status:
          $ref: '#/components/schemas/QuestStatus'
        stage_id:
          type: string
          default: ''
        done:
          type: boolean
        progress:
          type: integer
          minimum: 0
          maximum: 999
        progress_delta:
          type: integer
          minimum: -999
          maximum: 999

    QuestTriggerIn:
      type: object
      required: [when, apply]
      properties:
        id:
          type: string
          default: ''
        when:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/QuestTriggerClause'
        apply:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/QuestTriggerEffect'

    QuestTriggerCreate:
      allOf:
        - $ref: '#/components/schemas/QuestTriggerIn'
        - type: object
          properties:
            quest_id:
              type: string
              default: ''

    QuestTrigger:
      type: object
      required: [id, when, apply, applied]
      properties:
        id:
          type: string
        when:
          type: array
          items:
            $ref: '#/components/schemas/QuestTriggerClause'
        apply:
          type: array
          items:
            $ref: '#/components/schemas/QuestTriggerEffect'
        applied:
          type: boolean

    QuestList:
      type: object
      required: [quests, triggers]
      properties:
