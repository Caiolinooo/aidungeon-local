                $ref: '#/components/schemas/Error'
        '404':
          description: Aventura ou quest_not_found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: invalid_transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/sim/triggers:
    post:
      tags: [sim]
      summary: Criar gatilho de quest
      operationId: createQuestTrigger
      description: Só o dono. `when` e `apply` são obrigatórios.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestTriggerCreate'
      responses:
        '200':
          description: Vista do simulador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/sim/triggers/{triggerId}:
    delete:
      tags: [sim]
      summary: Apagar gatilho
      operationId: deleteQuestTrigger
      description: Só o dono.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: triggerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vista do simulador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Aventura ou trigger_not_found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/sim/life/playback:
    put:
      tags: [sim]
      summary: Iniciar, pausar ou alterar velocidade do tempo autônomo
      operationId: putLifePlayback
      description: Sem chamada LLM. Default pausado, 1×; cada segundo avança speed minutos lógicos.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [running]
              properties:
                running:
                  type: boolean
                speed:
                  type: integer
                  enum: [1, 4, 20]
      responses:
        '200':
          description: Estado do simulador, incluindo life.running e life.speed.
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Modo Vida desativado.

  /api/adventures/{adventureId}/sim/life/catchup:
    post:
      tags: [sim]
      summary: Recuperar tempo lógico parado, sem LLM
      operationId: catchUpLife
      description: Fatias idempotentes de até 60 minutos. A mesma chave não avança o relógio duas vezes. Teto de 24 horas.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  default: 1440
                key:
                  type: string
      responses:
        '200':
          description: Estado após o catch-up.
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Modo Vida desativado.

  /api/adventures/{adventureId}/sim/life/step:
    post:
      tags: [sim]
      summary: Avançar o tempo manualmente de forma idempotente
      operationId: stepLife
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 60
      responses:
        '200':
          description: Estado após o avanço.
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Modo Vida desativado.

  /api/adventures/{adventureId}/events/history:
    get:
      tags: [events]
      summary: Histórico durável do livefeed por cursor
      operationId: getEventHistory
      security:
        - bearerAuth: []
        - eventToken: []
      description: |
        Bearer no header ou `token` na query. O header ganha. O valor do
        token não entra no access log. `after` é um event_id exclusivo.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Página ordenada de eventos e estado do cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  next_cursor:
                    type: integer
                  has_more:
                    type: boolean
                  latest_event_id:
                    type: integer
                  reset_required:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/events:
    get:
      tags: [events]
      summary: Livefeed da aventura em SSE
      operationId: streamAdventureEvents
      security:
        - bearerAuth: []
        - eventToken: []
      description: |
        Fora do middleware de Bearer porque o EventSource não envia header.
        Aceita `Authorization: Bearer` ou `?token=`. História de outra pessoa
        responde 404. Reconexão com o header `Last-Event-ID` ou `last_event_id`.
        Comentário `: ping` a cada 15s. `retry: 3000`.

        Primeiro frame útil é `event: ready` com `id` do cursor. Se o cursor
        expirou, vem antes `event: reset_required` com `snapshot` do estado.
        Breaker de LLM aberto emite `event: llm_degraded`.
        Eventos duráveis trazem `id`. Jogador compartilhado não recebe
        `private_facts` nem intenção de outro jogador.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: last_event_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Stream SSE. O header Last-Event-ID também retoma o cursor.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Accel-Buffering:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/rulesets:
    get:
      tags: [rulesets]
      summary: Listar rulesets
      operationId: listRulesets
      description: Qualquer usuário autenticado. Inclui os seis builtins do seed.
      responses:
        '200':
          description: Lista completa, ordenada pelo nome.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ruleset'
    post:
      tags: [rulesets]
      summary: Criar ruleset (admin)
      operationId: createRuleset
      description: Só o admin. `name` e `rules` são obrigatórios. `builtin` nasce falso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesetUpsert'
      responses:
        '201':
          description: Ruleset criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '403':
          description: Usuário autenticado que não é o admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/rulesets/{id}:
    get:
      tags: [rulesets]
      summary: Obter um ruleset
      operationId: getRuleset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ruleset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [rulesets]
      summary: Atualizar ruleset (admin)
      operationId: updateRuleset
      description: Campos ausentes não mudam. Builtin também pode ser editado.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesetUpsert'
      responses:
        '200':
          description: Ruleset atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruleset'
        '403':
          description: Usuário autenticado que não é o admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [rulesets]
      summary: Apagar ruleset (admin)
      operationId: deleteRuleset
      description: Builtin também pode ser apagado. Cópias já aplicadas em aventuras não mudam.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ruleset apagado.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        '403':
          description: Usuário autenticado que não é o admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/rulesets/apply:
    post:
      tags: [rulesets]
      summary: Aplicar ruleset em character_rules
      operationId: applyRuleset
      description: |
        Exige dono ou admin (`_managed_adventure`). Quem não vê a aventura recebe 404.
        Quem vê mas não é dono recebe 403.

        `replace` (padrão) substitui `character_rules`.
        `append` grava `existente + "\n\n" + regras`, mesmo quando o texto atual está vazio.
        O resultado é cortado em 4000 caracteres.

        A resposta é o registro da aventura (schema Adventure), não o estado completo.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesetApply'
      responses:
        '200':
          description: Aventura com character_rules atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adventure'
        '403':
          description: Jogador com acesso que não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------- publications
  /api/publications:
    get:
