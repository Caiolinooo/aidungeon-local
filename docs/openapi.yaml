          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  $ref: '#/components/schemas/ModPackage'
      responses:
        '200':
          description: Mod atualizado e a versão nova.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModPublishResult'
        '403':
          description: Quem não é o dono do mod.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
