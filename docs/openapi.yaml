    LlmSettings:
      type: object
      description: Área de configuração do servidor LLM (config/settings.json + overrides do banco).
      properties:
        provider:
          type: string
          example: llamacpp
        base_url:
          type: string
          example: http://vm.groupabz.com:1234/v1
        api_key:
          type: string
          nullable: true
          example: "sk-…9f2a"
          description: Sempre mascarada nas respostas.
        model_alias:
          type: string
          example: auto
          description: '"auto" = descobre via GET {base_url}/models; ou id explícito do modelo.'
        model_discovered:
          type: string
          nullable: true
          example: Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ2_M.gguf
          description: Modelo que será usado de fato na geração (preenchido pela descoberta).
        context_size:
          type: integer
          example: 8192
          description: Janela total de contexto; a janela recente absorve a diferença (regra em settings.json).
        max_tokens:
          type: integer
          example: 300
          description: Tamanho máximo da resposta da IA (slider 100–600 na UI).
        streaming:
          type: boolean
          default: true
        disable_thinking:
          type: boolean
          default: true
          description: Envia chat_template_kwargs.enable_thinking=false (obrigatório p/ modelos Qwen3.x híbridos; senão content volta vazio).
        timeout_seconds:
          type: integer
          example: 180
        temperature:
          type: number
          example: 0.85
          description: Sampler efetivo (override sampler.temperature > settings.json sampler).
        top_p:
          type: number
          example: 0.95
        repetition_penalty:
          type: number
          example: 1.08

    LlmSettingsUpdate:
      type: object
      description: Todos os campos opcionais; omitidos permanecem.
      properties:
        base_url:
          type: string
        api_key:
          type: string
          nullable: true
          description: Enviar string vazia remove a chave; omitir mantém.
        model_alias:
          type: string
        context_size:
          type: integer
          minimum: 4096
          maximum: 131072
        max_tokens:
          type: integer
          minimum: 100
          maximum: 600
        streaming:
          type: boolean
        disable_thinking:
          type: boolean
        timeout_seconds:
          type: integer
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
          description: Persistido como override sampler.temperature.
        top_p:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Persistido como override sampler.top_p.
        repetition_penalty:
          type: number
          minimum: 1.0
          maximum: 2.0
          description: Persistido como override sampler.repetition_penalty.

    ProviderHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, disabled, unreachable, auth_error, error]
        enabled:
          type: boolean
        provider:
          type: string
        details:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true

    LlmHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unreachable, auth_error, error]
        provider:
          type: string
          example: llamacpp
        base_url:
          type: string
          example: http://vm.groupabz.com:1234/v1
        model_alias:
          type: string
          example: auto
        model_discovered:
          type: string
          nullable: true
          example: Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ2_M.gguf
        model_loaded:
          type: boolean
        details:
          type: string
          nullable: true
          description: Mensagem de erro, motivo do `degraded` ou informação extra do runtime.
        scheduler:
          type: object
          description: Snapshot do llm_scheduler.
          properties:
            breaker:
              type: object
              properties:
                state:
                  type: string
                  enum: [closed, open, half_open]
                failures:
                  type: integer
                until:
                  type: string
                  nullable: true
                  description: Fim do breaker aberto (ISO UTC); null fora de `open`.
            narratives:
              type: integer
            aux_in_flight:
              type: integer
            aux_cap:
              type: integer
            busy_slots:
              type: array
              items:
                type: integer
            reserved_slots:
              type: array
              items:
                type: integer
              description: Slots tomados pelo fallback da narrativa.
            waiting:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                  slot:
                    type: integer
                    nullable: true
                  waited_s:
                    type: number
        slots:
          type: object
          properties:
            total:
              type: integer
              nullable: true
              description: total_slots de /props; null com o servidor fora do ar.
            roles:
              type: object
              additionalProperties:
                type: integer
                nullable: true
              example: {narrative: 0, choices: 1, chronicle: 2, summary: 2, image_prompt: 3, assistant: 3, meta: 3}
            watchdog:
              type: object
              nullable: true
              description: |
                `status.json` do slot_watchdog (`scheduler.watchdog_status_path`)
                mais `age_s` e `stale` (sem leitura há mais de 60 s); null sem o arquivo.
              properties:
                checked_at:
                  type: string
                age_s:
                  type: number
                  nullable: true
                stale:
                  type: boolean
                slots:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      busy:
                        type: boolean
                      stalled_s:
                        type: number
                unreachable_s:
                  type: number
                restarts:
                  type: integer
                last_restart:
                  type: object
                  nullable: true
                hint:
                  type: object
                  nullable: true
        jobs:
          type: object
          description: 'Jobs ativos por status e tipo (`{tipo: quantidade}`).'
          properties:
            preparing:
              type: object
              additionalProperties:
                type: integer
            pending:
              type: object
              additionalProperties:
                type: integer
            running:
              type: object
              additionalProperties:
                type: integer
            oldest_pending_s:
              type: number
              nullable: true
        memory:
          type: object
          description: /proc/meminfo e nvidia-smi; campos ausentes quando a fonte não existe.
          properties:
            ram_total_mb:
              type: integer
            ram_available_mb:
              type: integer
            swap_total_mb:
              type: integer
            swap_used_mb:
              type: integer
            vram_used_mb:
              type: integer
            vram_total_mb:
              type: integer
        narrative:
          type: object
          description: Últimas 20 narrativas ok e a última narrativa (qualquer outcome).
          properties:
            samples:
              type: integer
            ttft_p50_s:
              type: number
              nullable: true
            ttft_p95_s:
              type: number
              nullable: true
            tok_s_p50:
              type: number
              nullable: true
            last:
              type: object
              nullable: true
              description: role, slot, outcome, at, total_s, waited_s, ttft_s, prompt_n, cache_n, predicted_n, prompt_per_second, predicted_per_second, fallback.

    SseStream:
      type: string
      description: |
        Fluxo `text/event-stream`. Eventos possíveis, nesta ordem quando existem:
        - `rules_roll`: resolução mecânica, antes dos tokens;
        - `action_check`: veredito de viabilidade, antes dos tokens;
        - `adjudication`: `AdjudicationEvent` (decisão, desfecho, reações,
          iniciativa). Antes dos tokens. Sem `relation_changes` e sem motivo oculto;
        - `token`: `data: {"token": "<trecho>"}` — um por token gerado;
        - `done`: `player_action`?, `action`, `action_check`?, `rules`?,
          `adjudication`? (`TurnAdjudication`, com `relation_changes` observáveis).
          `story` não traz adjudicação; `retry` preserva a anterior sem novo delta;
        - `error`: `data: {"message": "<motivo>"}` — falha; o stream encerra.
          Resposta que fica sem prosa depois da limpeza (só blocos de contexto
          copiados pelo narrador) também vira `error`, sem gravar o `continue`.

    AdjudicationEvent:
      type: object
      required: [decision, outcome, reactions, initiative]
      description: |
        Decisão visível emitida antes dos tokens. Não inclui `relation_changes`.
      properties:
        decision:
          type: string
          enum: [allow, partial, refuse, own_beat]
        outcome:
          type: string
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/NpcReaction'
        initiative:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/NpcInitiative'

    NpcReaction:
      type: object
      required: [npc, card_id, reaction, line]
      properties:
        npc:
          type: string
        card_id:
          type: string
        reaction:
          type: string
        line:
          type: string
        emotion:
          type: string
        pose:
          type: string

    NpcInitiative:
      type: object
      required: [npc, card_id, line]
      properties:
        npc:
          type: string
        card_id:
          type: string
        line:
          type: string

    RelationChange:
      type: object
      required: [card_id, name, target, delta, reason, evidence]
      description: |
        Fato observável do commit. `reason` e `evidence` descrevem o que a cena
        mostrou. Não carregam motivação oculta, segredo ou pensamento não dito.
      properties:
        card_id:
          type: string
        name:
          type: string
        target:
          type: string
          description: '`player` ou o card_id de outro NPC.'
        delta:
          type: object
          additionalProperties:
            type: integer
        reason:
          type: string
          description: Fato observável. Sem motivação oculta.
        evidence:
          type: string
          description: Trecho observável que sustenta o delta.

    TurnAdjudication:
      allOf:
        - $ref: '#/components/schemas/AdjudicationEvent'
        - type: object
          required: [relation_changes]
          properties:
            relation_changes:
              type: array
              items:
                $ref: '#/components/schemas/RelationChange'

    # ------------------------------------------------------- v2: assistant/images
    ChoicesResponse:
      type: object
      required: [choices]
      properties:
        choices:
          type: array
          description: Exatamente settings.choices.count itens (default 3); vazio quando desabilitado.
          items:
            type: object
            required: [type, text]
            properties:
              type:
                type: string
                enum: [do, say, story]
              text:
                type: string
                maxLength: 120
                description: Sugestão curta em inglês.

    # ------------------------------------------------------- v0.7.0: ui-profile
    UiTab:
      type: object
      required: [id, label, placeholder]
      properties:
        id:
          type: string
          enum: [do, say, story]
          description: Fixo (constraint do banco); só label/placeholder mudam.
        label:
          type: string
          maxLength: 12
        placeholder:
          type: string
          maxLength: 60

    UiWidget:
      type: object
      required: [id, type, label]
      description: |
        Widget do painel (whitelist, máx. 6). Campos por tipo:
        - `dice`: `dice` (lados permitidos: 4, 6, 8, 10, 12, 20, 100);
        - `stats`: `stats` [{name, value, max?, min?}], máx. 8;
        - `inventory`: `items` [{name, qty}], máx. 24 (inicial vazio é válido);
        - `character`: `fields` [{name, value}], máx. 12.
      properties:
        id:
          type: string
          maxLength: 24
        type:
          type: string
          enum: [dice, stats, inventory, character]
        label:
          type: string
          maxLength: 24
        dice:
          type: array
          items: {type: integer, enum: [4, 6, 8, 10, 12, 20, 100]}
        stats:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: {type: string, maxLength: 24}
              value: {type: integer}
              max: {type: integer, nullable: true}
              min: {type: integer, nullable: true}
        items:
          type: array
          items:
            type: object
            required: [name, qty]
            properties:
              name: {type: string, maxLength: 24}
              qty: {type: integer, minimum: 1}
        fields:
          type: array
          items:
