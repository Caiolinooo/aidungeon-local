  # ------------------------------------------------------------ import/export
  /api/import/aidungeon:
    post:
      tags: [import-export]
      summary: Importar backup do AI Dungeon (.zip)
      operationId: importAidungeon
      description: |
        Recebe o `.zip` do backup oficial (multipart). O importador
        (PLANO.md §2.1/§4.6) lê `metadata.json` + `actions-*.json` (ordenados
        por `partNumber`), cria scenario implícito + aventura, e insere ações
        na ordem do array (`seq` 0..N), story cards (triggers = split/trim de
        `keys`) e memórias. Um JSON solto de story cards pode acompanhar o zip
        para merge/validação.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup .zip exportado do AI Dungeon.
      responses:
        '201':
          description: Importação concluída (relatório).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '400':
          description: Arquivo inválido ou formato não reconhecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/export:
    get:
      tags: [import-export]
      summary: Exportar aventura NO MESMO FORMATO do backup
      operationId: exportAdventure
      description: |
        Gera um `.zip` byte-compatível com o formato de backup do AI Dungeon
        (`metadata.json` + `actions-001.json`, ...), permitindo round-trip
        import → export → import.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Zip no formato de backup do AI Dungeon.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ settings
  /api/settings/llm:
    get:
      tags: [settings]
      summary: Ler configuração do servidor LLM
      operationId: getLlmSettings
      description: |
        Devolve a config efetiva (arquivo `config/settings.json` + overrides
        persistidos na tabela `settings` do banco). `api_key` nunca é devolvida
        em claro — vem mascarada (`"sk-…1234"`) ou `null`.
      responses:
        '200':
          description: Configuração atual do LLM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettings'
    put:
      tags: [settings]
      summary: Atualizar configuração do servidor LLM
      operationId: putLlmSettings
      description: |
        Persiste overrides na tabela `settings` (prevalecem sobre o arquivo).
        Campos omitidos permanecem. Após mudar `base_url`/`model_alias`, o
        backend refaz a descoberta de modelo (`GET {base_url}/models`).
        `api_key` é armazenada localmente e nunca exposta em logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada (com modelo redescoberto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettings'
        '403':
          description: Somente admin pode alterar configuração global.
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/settings/embeddings:
    get:
      tags: [settings]
      summary: Ler configuração de embeddings
      operationId: getEmbeddingsSettings
      responses:
        '200':
          description: Config efetiva (arquivo + overrides).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsSettings'
    put:
      tags: [settings]
      summary: Atualizar embeddings
      operationId: putEmbeddingsSettings
      description: Só o admin. Campos omitidos permanecem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsSettingsUpdate'
      responses:
        '200':
          description: Config aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsSettings'
        '403':
          description: Somente admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/settings/scripting:
    get:
      tags: [settings]
      summary: Ler scripts globais
      operationId: getScriptingSettings
      description: |
        Os três hooks globais. A aventura só usa o global quando a chave dela
        não existe.
      responses:
        '200':
          description: Textos globais.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptHooks'
    put:
      tags: [settings]
      summary: Gravar scripts globais
      operationId: putScriptingSettings
      description: |
        Só o admin. Campo ausente não muda. String vazia apaga a chave global.
        Este PUT não executa o script.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptHooks'
      responses:
        '200':
          description: Textos globais depois da gravação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptHooks'
        '403':
          description: Somente admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ------------------------------------------------------------------ assistant
  /api/assistant/generate:
    post:
      tags: [assistant]
      summary: Gerar o cenário inteiro, com fichas vivas quando pedido
      operationId: assistantGenerate
      description: |
        Mesmo rascunho de /assistant/scenario. current entra no prompt como
        o rascunho a regenerar. deep_characters=true chama a ficha completa
        de cada card type=character; o que o rascunho já tiver prevalece.
        Robusto a truncamento: se o JSON do rascunho for cortado pelo teto de
        tokens, o texto é salvo no último nível completo e os cards que faltam
        saem numa passagem dedicada; se a ficha profunda de um personagem
        falhar, ele fica com a ficha determinística (status/classe/atributos)
        e os textos vivos chegam depois pelo job card_assets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantGenerateRequest'
      responses:
        '200':
          description: Rascunho gerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDraft'
        '503':
          description: |
            generation_failed. `error.hint` traz o detalhe acionável
            (por exemplo, resposta sem title) sem mudar `error.code` nem `error.message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/scenario:
    post:
      tags: [assistant]
      summary: Gerar rascunho completo de cenário a partir de uma ideia
      operationId: assistantScenario
      description: |
        Recebe uma ideia em linguagem natural (`brief`, PT ou EN) e devolve um
        rascunho ESTRUTURADO completo (título, descrição, ai_instructions,
        plot_essentials, authors_note, opening_text, tags e story cards
        iniciais). NÃO persiste nada — o frontend revisa e depois chama
        POST /api/scenarios. Campos de texto narrativo são gerados em inglês
        (convenção do jogo); `brief` pode ser em qualquer idioma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantScenarioRequest'
      responses:
        '200':
          description: Rascunho gerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDraft'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/field:
    post:
      tags: [assistant]
      summary: Regenerar um campo do rascunho (ou sugerir story cards)
      operationId: assistantField
      description: |
        Regenera UM campo mantendo coerência com o resto do rascunho enviado.
        `field=story_cards` devolve array de cards (merge/substituição é
        decisão do frontend).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantFieldRequest'
      responses:
        '200':
          description: Campo regenerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantFieldResponse'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/card:
    post:
      tags: [assistant]
      summary: Gerar ou enriquecer um story card
      operationId: assistantCard
      description: |
        Um card só. `adventure_id` entra como contexto se o usuário enxerga a
        aventura; senão o contexto vem de `draft`. `web_search` anexa fontes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantCardRequest'
      responses:
        '200':
          description: Card gerado e fontes, se houve busca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantCardResponse'
        '503':
          description: generation_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/sync-plot:
    post:
      tags: [assistant]
      summary: Sugerir Plot Essentials e Author's Note
      operationId: assistantSyncPlot
      description: |
        Lê a aventura recente e devolve sugestão. Não grava sozinho.
        Aventura invisível responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantSyncPlotRequest'
      responses:
        '200':
          description: Textos sugeridos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSyncPlotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: generation_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/web-search:
    post:
      tags: [assistant]
      summary: Pesquisa direta para a UI
      operationId: assistantWebSearch
      description: Consulta Wikipedia e a web. Não chama o LLM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSearchRequest'
      responses:
        '200':
          description: Resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSearchResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  # -------------------------------------------------------------------- images
  /api/adventures/{adventureId}/see:
    post:
      tags: [images]
      summary: Gerar imagem da cena (ação "See")
      operationId: postSee
      description: |
        Fluxo: (1) o LLM resume a cena recente (até settings.image.prompt_builder
        .max_scene_chars) em um prompt de imagem EN, prefixado por
        adventures.image_style; (2) chama o provedor configurado
        (settings.image.provider: `sdwebui` → POST {base_url}/sdapi/v1/txt2img;
        `openai_compatible` → POST {base_url}/images/generations com Bearer);
        (3) salva o arquivo em settings.image.storage_dir/<adventure_id>/;
        (4) grava linha em `images` e uma action `type=see` (text = prompt
        resumido) vinculada pelo mesmo seq, no fim da aventura; (5) devolve a imagem.
        Sem lock de geração: o jogador age enquanto a imagem sai.
        Com `Prefer: respond-async` (ou `?async=1`) responde 202 {job_id} na
        hora e o resto vira o job `see_image` (contrato C6): resultado em
        `see_ready`/`see_failed` no SSE ou por polling em GET /api/jobs/{id}.
        Sem o header, resposta JSON síncrona (geração local pode levar
        minutos — o frontend mostra spinner). 503 se provider inalcançável.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
          description: '`respond-async` pede o 202.'
        - name: async
          in: query
          required: false
          schema:
            type: boolean
          description: 'Mesmo efeito do `Prefer: respond-async`.'
        - name: variation
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Variação independente no cache; omitida preserva a chave anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeeRequest'
      responses:
        '200':
          description: Imagem gerada e vinculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResult'
        '202':
          description: Job see_image criado em `preparing` (header Preference-Applied respond-async).
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Provedor de imagem indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/clips:
    post:
      tags: [images]
      summary: Gerar clipe MP4 a partir de um PNG (LTXV ou Wan2.2)
      operationId: postAdventureClip
      description: |
        Enfileira o job `scene_clip` (prioridade 3). O corpo é
        `{image_id, prompt}`. A fonte tem de ser um PNG raster desta
        aventura; vídeo, arquivo ausente ou raster inválido responde 404,
        o mesmo de aventura de outra pessoa. 202 `{job_id}`.
        O default é LTXV 2B distilled (`CheckpointLoaderSimple`, T5 FP8,
        8 passos, CFG 1, 121 frames/24 fps, 768×448). `video.engine=wan`
        mantém o Wan2.2 TI2V 5B opt-in. A engine e seus parâmetros visuais
        entram na chave de cache; flags de automação e timeout não entram.
        Com provider de imagem sdwebui local, o worker descarrega Forge e
        ComfyUI. Com ComfyUI, não força `/free` entre clipes, permitindo reuso
        do modelo carregado. Narrador e voz não são chamados nem descarregados.
        Repetir fonte+prompt de um job ativo reutiliza esse job; prompt novo
        manual substitui pendentes da mesma fonte. Com `video.auto_scene`/
        `video.auto_portraits`, o PNG concluído enfileira o follow-up sem LLM;
        lote/offscene não anima e automação não cancela clipe manual ativo.
        Nova ação, continuação ou retry preempta apenas clipes automáticos
        pendentes/running; manuais continuam.
        O SSE `clip_ready` traz `adventure_id`, `job_id`, `source_image_id`
        e `image` `{id, url, media_type: video/mp4, duration_ms}`.
        Cancelar um job running manda `/interrupt` e `/free` e não grava o MP4.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipRequest'
      responses:
        '202':
          description: Job scene_clip criado (pending).
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id:
                    type: string
        '400':
          description: Prompt vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Geração de imagem desligada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/choices:
    post:
      tags: [generation]
      summary: Sugerir próximas ações para o jogador
      operationId: postChoices
      description: |
        Após ler a cena recente, o LLM sugere `settings.choices.count`
        (default 3) opções curtas de próxima ação — array JSON de
        {type: do|say|story, text ≤ 120 chars}, textos em inglês.
        Sem body. Quando `settings.choices.enabled=false` devolve
        200 {"choices": []}. Usa o mesmo lock por aventura da geração
        (action/continue/retry/see).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Opções sugeridas (ou lista vazia se desabilitado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoicesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração em andamento para a aventura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/ui-profile:
    get:
      tags: [ui-profile]
      summary: Ler manifesto de controles + estado dos widgets
      operationId: getUiProfile
      description: |
        Devolve o manifesto gerado pela IA (`profile`: tabs do InputBar +
        widgets dice/stats/inventory/character) e o estado atual dos widgets
        (`state`, editado pelo jogador). `profile: null` = aventura sem painel
        (não gerado ou `settings.ui_profile.enabled=false`).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Manifesto + estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UiProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ui-profile]
      summary: Gerar (ou redesenhar) o manifesto de controles via LLM
      operationId: postUiProfile
      description: |
        O LLM lê título, descrição, AI instructions, plot essentials, author's
        note e abertura da aventura e devolve o manifesto JSON do painel.
        A resposta é normalizada por whitelist (ids de tab fixos do/say/story;
        tipos de widget dice/stats/inventory/character; limites de tamanho) e
        persistida em `adventures.ui_profile`. Na primeira geração o estado
        inicial dos widgets (valores do LLM) é gravado em `ui_state` —
        gerações seguintes preservam o estado editado pelo jogador.
        `enabled=false` → 200 com `profile: null`. Usa o mesmo lock por
        aventura da geração (action/continue/retry/see/choices).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Manifesto gerado + estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UiProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração em andamento para a aventura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LLM indisponível ou resposta não parseável.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/ui-state:
    put:
      tags: [ui-profile]
      summary: Gravar estado dos widgets (edição do jogador)
      operationId: putUiState
      description: |
        Substitui `adventures.ui_state` (HP, inventário, ficha). O frontend
        envia com debounce de ~600 ms a cada edição. Limite de 16 KB
        serializados. O estado entra no contexto do LLM como bloco
        `[Player state]` na próxima geração.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UiStateUpdate'
      responses:
        '200':
          description: Estado gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UiStateResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Estado excede 16 KB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/images/{imageId}:
    get:
      tags: [images]
      summary: Servir PNG ou MP4 gerado
      operationId: getImage
      description: |
        Exige Bearer. História de outra pessoa responde 404.
        `media_type` da linha define o MIME: raster continua `image/png`;
        clipe sai `video/mp4`. `?download=1` adiciona
        `Content-Disposition: attachment`.
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: '`1` envia o arquivo como anexo.'
      responses:
        '200':
          description: PNG ou MP4.
          content:
            image/png:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/settings/image:
    get:
      tags: [settings]
      summary: Ler configuração de geração de imagens
      operationId: getImageSettings
      responses:
        '200':
          description: Config efetiva (api_key mascarada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSettings'
    put:
      tags: [settings]
      summary: Atualizar configuração de geração de imagens
      operationId: putImageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSettings'
        '403':
          description: Somente admin pode alterar configuração global.
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------- voice
  /api/voices:
    get:
      tags: [voice]
      summary: Listar vozes TTS disponíveis + voz do narrador
      operationId: listVoices
      responses:
        '200':
          description: Vozes da config efetiva (settings.voice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceList'

  /api/voices/clone:
    post:
      tags: [voice]
      summary: Clonar uma voz a partir de um áudio
      operationId: cloneVoice
      description: |
        Multipart com `file` e `name` (1–40 caracteres). `ref_text` vazio faz
        o STT preencher o que foi dito. Áudio vazio ou acima de 15 MiB responde
        400 `invalid_audio`. Nome repetido é 409 `voice_name_taken`.
        Voz desligada é 400 `voice_disabled`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                ref_text:
                  type: string
                  default: ''
      responses:
        '200':
          description: Voz clonada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClonedVoice'
        '400':
          description: invalid_payload, invalid_audio, ref_text_empty ou voice_disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: voice_name_taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider de voz indisponível ou RVQ inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/voices/{voiceId}:
    delete:
      tags: [voice]
      summary: Apagar uma voz clonada
      operationId: deleteVoice
      description: |
        Só o dono da voz (ou admin). Voz de outro usuário responde 404
        `voice_not_found`. Cards que apontavam para ela perdem o vínculo.
        Se era a voz do narrador, o narrador volta para `M1`.
      parameters:
        - name: voiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Voz apagada.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '404':
          description: voice_not_found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tts:
    post:
      tags: [voice]
      summary: Sintetizar texto em áudio (mp3)
      operationId: postTts
      description: |
        Chama `POST {voice.base_url}/audio/speech` (Supertonic, formato OpenAI
        TTS) e devolve os bytes em passthrough. `voice` omitida (null) usa
        `narrator_voice` da config. `emotion` é dica; a linha vence e, sem
        palavra de emoção, vale a ficha do NPC citado em `adventure_id`.
        A emoção escolhida volta no header `X-Voice-Emotion` e no campo
        `instructions` do provider. Com `drama3_enabled` falso o texto falado
        continua limpo (Supertonic). Validações: `voice_disabled` (400),
        `invalid_payload` (texto vazio, 400), `text_too_long` (acima de
        max_text_chars, 400), `invalid_voice` (fora da lista ou '', 400).
        Provider indisponível → 502 (`unreachable`/`auth_error`/`error`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: Áudio sintetizado (bytes mp3, NÃO JSON).
          headers:
            X-Voice-Emotion:
              description: Emoção escolhida (joy, anger, fear, sadness, tenderness, surprise, disgust, neutral).
              schema:
                type: string
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Validação (voice_disabled/invalid_payload/text_too_long/invalid_voice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider de voz indisponível ou erro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tts/stream:
    post:
      tags: [voice]
      summary: Sintetizar texto em WAV progressivo (PCM16 mono 24 kHz)
      operationId: postTtsStream
      description: |
        Usa as mesmas validações, voz, clone e emoção de `/api/tts`, mas chama o
        OmniVoice com `response_format=wav` e transmite os chunks sem esperar o
        áudio completo. Não usa fallback Drama-3. Cancelamento fecha o HTTP do
        provider; `/api/tts` continua devolvendo MP3 completo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: Stream WAV PCM16 mono 24 kHz.
          headers:
            X-Voice-Emotion:
              description: Emoção escolhida para a fala.
              schema:
                type: string
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400':
          description: Validação igual a `/api/tts`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider de voz indisponível ou erro antes do stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stt:
    post:
      tags: [voice]
      summary: Transcrever áudio (Whisper)
      operationId: postStt
      description: |
        Multipart campo `file` (webm/ogg/mp3/wav/m4a). Repassa ao provider
        `POST {voice.base_url}/audio/transcriptions` com model=stt_model e
        devolve `{"text": ...}` (formato OpenAI whisper). Validações:
        arquivo ausente → 400 `invalid_payload`; Content-Length acima de
        stt_max_bytes → 413 `audio_too_large`; enabled=false → 400
        `voice_disabled`. Provider → 502 como no /tts.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de áudio (webm/ogg/mp3/wav/m4a).
      responses:
        '200':
          description: Transcrição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttResult'
        '400':
          description: Arquivo ausente ou voz desabilitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Áudio acima de stt_max_bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider de voz indisponível ou erro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/voice:
    get:
      tags: [voice]
      summary: Ler configuração de voz (TTS/STT)
      operationId: getVoiceSettings
      responses:
        '200':
          description: Config efetiva (api_key mascarada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettings'
    put:
      tags: [voice]
      summary: Atualizar configuração de voz (TTS/STT)
      operationId: putVoiceSettings
      description: narrator_voice fora da lista → 400 invalid_voice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettings'
        '400':
          description: narrator_voice inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Somente admin pode alterar configuração global.
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------- health
  /api/health/llm:
    get:
      tags: [health]
      summary: Status do servidor LLM, scheduler, slots, fila de jobs e memória
      operationId: healthLlm
      description: |
        Sonda `GET {base_url}/models` em tempo real: confirma alcance, auth e
        devolve o modelo que será usado na geração (descoberta automática
        quando `model_alias = "auto"`).

        Também traz, sem cache (VRAM: 5 s), o estado do scheduler (breaker,
        fila, slots ocupados), o slot de cada role, o `status.json` do
        slot_watchdog, a fila de jobs, RAM/swap/VRAM e TTFT/tok/s das últimas
        narrativas. Com o servidor respondendo, `status` vira `degraded`
        quando o breaker está aberto ou o watchdog vê `/slots` sem resposta
        ou um slot ocupado sem progresso há 30 s ou mais.
      responses:
        '200':
          description: Sempre 200; o campo `status` informa a saúde do LLM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmHealth'


  /api/health/voice:
    get:
      tags: [health]
      summary: Sonda não gerativa do provider de voz
      operationId: healthVoice
      description: Consulta /models com timeout de 5 s. Não sintetiza nem transcreve áudio.
      responses:
        '200':
          description: Sempre 200; status informa ok, unreachable, auth_error ou error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealth'

  /api/health/image:
    get:
      tags: [health]
      summary: Sonda não gerativa do provider de imagem
      operationId: healthImage
      description: SDWebUI usa /sdapi/v1/options; OpenAI-compatible usa /models.
      responses:
        '200':
          description: Sempre 200; status inclui também disabled quando desligado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealth'

  # ------------------------------------------------------------------ rulesets
  /api/adventures/{adventureId}/sim:
    get:
      tags: [sim]
      summary: Vista pública do simulador
      operationId: getSim
      description: Quem enxerga a aventura. Não inclui fatos privados do blob cru.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Pack, ator, inimigos vivos, relógio, quests e gatilhos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/sim/pack:
    put:
      tags: [sim]
      summary: Ligar ou trocar o pacote de regras
      operationId: putSimPack
      description: |
        Só o dono. `pack` vazio desliga as regras. Valores aceitos são `""`,
        `d20` e `d100`. Com pack, o ator de quem grava é criado se ainda não existe.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimPackUpdate'
      responses:
        '200':
          description: Vista do simulador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: invalid_pack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/sim/life:
    put:
      tags: [sim]
      summary: Ligar ou desligar o Modo Vida
      operationId: putSimLife
      description: Só o dono. Desligar também pausa o playback. Sem chamada de LLM.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimLifeUpdate'
      responses:
        '200':
          description: Vista do simulador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/sim/life/advance:
    post:
      tags: [sim]
      summary: Avançar o relógio com uma atividade
      operationId: advanceLife
      description: |
        Quem enxerga a aventura. Não é o catch-up idempotente. Exige Modo Vida
        ligado (409 `life_disabled`). Meia-noite pode enfileirar o tick do dia.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimAdvance'
      responses:
        '200':
          description: Vista depois do avanço.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: life_disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/sim/actor:
    put:
      tags: [sim]
      summary: Ajustar a ficha mecânica de quem está logado
      operationId: putSimActor
      description: |
        Campos ausentes não mudam. `resync` recolhe habilidades a partir da ficha
        do personagem. Números são limitados pelo servidor.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimActorUpdate'
      responses:
        '200':
          description: Vista do simulador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/sim/roll:
    post:
      tags: [sim]
      summary: Rolar dados no servidor
      operationId: rollSim
      description: |
        Não chama o LLM. `d20` com `mode` `adv` ou `dis` rola vantagem ou
        desvantagem. Outra expressão passa pelo parser de dados.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimRollRequest'
      responses:
        '200':
          description: Resultado da rolagem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimRollResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: invalid_dice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/sim/action:
    post:
      tags: [sim]
      summary: Resolver uma ação mecânica sem LLM
      operationId: postSimAction
      description: |
        O jogador clicou; o servidor rola. Exige pack ou Modo Vida
        (409 `sim_off`). Recusa das regras é 409 `rules_refused`.
        A resposta é a vista do simulador mais `resolution`.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimActionRequest'
      responses:
        '200':
          description: Vista e a resolução.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimActionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: sim_off ou rules_refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid_kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/sim/quests:
    get:
      tags: [sim]
      summary: Quests e gatilhos visíveis
      operationId: listQuests
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Listas públicas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sim]
      summary: Criar quest
      operationId: createQuest
      description: Só o dono. A resposta é a vista inteira do simulador.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestCreate'
      responses:
        '200':
          description: Vista do simulador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/sim/quests/{questId}:
    patch:
      tags: [sim]
      summary: Editar quest
      operationId: patchQuest
      description: Só o dono. Campos ausentes não mudam.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: questId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestPatch'
      responses:
        '200':
          description: Vista do simulador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Aventura ou quest_not_found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [sim]
      summary: Apagar quest
      operationId: deleteQuest
      description: Só o dono.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: questId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vista do simulador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimState'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Aventura ou quest_not_found.
          content:
