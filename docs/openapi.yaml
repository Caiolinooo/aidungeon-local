              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [publications]
      summary: Publicar cenário ou aventura
      operationId: publishSource
      description: |
        `kind` é `scenario` ou `adventure`. Só o dono da fonte (ou admin).
        Conteúdo igual à última versão já gravada responde 200 com `created` false.
        Publicação nova ou versão nova responde 201 com `created` true.
