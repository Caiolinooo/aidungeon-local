openapi: 3.0.3
info:
  title: AI Dungeon Local — API
  version: 0.4.0
  description: |
    API REST do clone local do AI Dungeon (PLANO.md §4.4).

    Convenções gerais:
    - Todos os endpoints respondem JSON (`application/json`), exceto:
      - os endpoints de geração (`/action`, `/continue`, `/retry`), a aprovação
        de uma intenção pendente e `GET /api/adventures/{id}/events`, que
        respondem `text/event-stream` (SSE);
      - `/api/tts` (`audio/mpeg`) e `/api/tts/stream` (`audio/wav`);
      - `/api/adventures/{id}/export` e `GET /api/adventures/export`, que
        respondem `application/zip`.
    - Booleans do banco (INTEGER 0/1) são expostos como `true/false`.
    - Campos `tags` e `triggers` são TEXT JSON no banco, expostos como arrays.
    - Timestamps em ISO-8601 UTC.
    - Erros seguem o schema `Error`.
  contact:
    name: AI Dungeon Local (self-hosted)
servers:
  - url: http://127.0.0.1:8000
    description: backend local (FastAPI)

tags:
  - name: auth
    description: Login e verificação de token. Todas as demais rotas /api exigem Bearer.
  - name: scenarios
  - name: adventures
  - name: rulesets
    description: Sistemas de regras para criação de personagem. Leitura aberta a qualquer usuário autenticado. Criar, editar e apagar só o admin. Apply copia o texto para character_rules.
  - name: generation
    description: Endpoints que geram texto via LLM e streamam por SSE.
  - name: actions
  - name: cards
  - name: memory
  - name: import-export
  - name: settings
    description: Área de configuração do servidor LLM (endpoint, chave, modelo, tokens).
  - name: assistant
    description: Assistente de criação de cenários (geração estruturada via LLM).
  - name: images
    description: Geração de imagens da cena (ação "See") — provedor sdwebui local/LAN ou endpoint OpenAI-compatible.
  - name: assets
    description: Pipeline assíncrono de assets (v0.3.0) — fila de jobs que gera retratos de NPCs em background; a UI faz polling e aplica cada asset ao concluir.
  - name: voice
    description: Voz (v0.4.0) — TTS Supertonic e STT Whisper via stack OpenAI-compatível da VM; /tts devolve bytes audio/mpeg (não JSON).
  - name: ui-profile
    description: Controles dinâmicos (v0.7.0) — manifesto do painel gerado pela IA (tabs + widgets) e estado dos widgets editável pelo jogador.
  - name: consistency
    description: Cross-check do projeto — ficha do NPC ↔ prompt de retrato ↔ imagem ↔ memória ↔ embedding, com reparo por IA.
  - name: health
  - name: scripts
    description: Scripts de input, context e output por aventura. O PUT valida no sandbox e não executa.
  - name: publications
    description: Catálogo com versões imutáveis, likes e remix. Publicar exige dono ou admin da fonte.
  - name: mods
    description: Mods e a aplicação por aventura. O pacote é validado; aplicar só insere cards e links que ainda não existem.
  - name: sim
    description: Motor de regras e Modo Vida. A maior parte das rotas devolve a vista pública do simulador.
  - name: events
    description: Livefeed durável. O stream aceita Bearer ou ?token= porque o EventSource não envia header.
  - name: users
    description: Contas. Listar, criar, apagar e redefinir senha alheia é só o admin.
  - name: world-map
    description: Mapa, journal e locais. Destino ainda não revelado fica fora do payload.

# Toda rota /api exige Bearer token, exceto as marcadas com `security: []` (login).
# GET /api/adventures/{id}/events e /events/history também aceitam ?token=.
# Arquivos estáticos da SPA (fora de /api) são públicos — a página de login precisa carregar.
security:
  - bearerAuth: []

paths:
  # --------------------------------------------------------------------- auth
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login — devolve token Bearer
      operationId: login
      security: []
      description: |
        Valida username/senha contra AUTH_USER e AUTH_PASSWORD_HASH (sha256)
        do ambiente. Sucesso devolve token HMAC-SHA256 assinado com AUTH_SECRET
        (TTL de settings.auth.token_ttl_hours). Falha devolve 401 genérico
        (não distingue usuário de senha).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/check:
    get:
      tags: [auth]
      summary: Verificar se o token atual é válido
      operationId: checkAuth
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  user:
                    type: string
                  admin:
                    type: boolean
                    description: true só na conta administradora do servidor.
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/password:
    post:
      tags: [auth]
      summary: Trocar a própria senha
      operationId: changePassword
      description: |
        Exige a senha atual. A nova senha tem no mínimo 8 caracteres.
        Não devolve token novo; o Bearer atual continua válido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Senha atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResult'
        '400':
          description: invalid_password — senha nova curta demais.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: auth_not_configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------- scenarios
  /api/scenarios:
    post:
      tags: [scenarios]
      summary: Criar scenario
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '201':
          description: Scenario criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [scenarios]
      summary: Listar scenarios (biblioteca, com busca por tag)
      operationId: listScenarios
      parameters:
        - name: tag
          in: query
          description: Filtra scenarios que contêm a tag.
          schema:
            type: string
        - name: q
          in: query
          description: Busca textual em título/descrição.
          schema:
            type: string
      responses:
        '200':
          description: Lista de scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'

  /api/scenarios/{scenarioId}:
    get:
      tags: [scenarios]
      summary: Obter scenario por id
      operationId: getScenario
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: Scenario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [scenarios]
      summary: Atualizar parcialmente um cenário (dono/admin)
      operationId: patchScenario
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioUpdate'
      responses:
        '200':
          description: Cenário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '403':
          description: Usuário não é dono nem admin.
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [scenarios]
      summary: Substituir um cenário (dono/admin)
      operationId: putScenario
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioUpdate'
      responses:
        '200':
          description: Cenário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '403':
          description: Usuário não é dono nem admin.
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [scenarios]
      summary: Apagar um cenário (dono/admin)
      operationId: deleteScenario
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: Cenário apagado.
        '403':
          description: Usuário não é dono nem admin.
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- adventures
  /api/adventures:
    post:
      tags: [adventures]
      summary: Nova aventura (a partir de scenario ou vazia)
      operationId: createAdventure
      description: |
        Com `scenario_id`, copia os campos do scenario para a aventura e grava
        a action inicial (`type=start`, texto = `opening_text` do scenario).
        Sem `scenario_id`, cria aventura em branco.

        Na criação a partir de scenario os NPCs já nascem com a ficha
        determinística preenchida (status, classe inferida, atributos
        estimados), os retratos entram na fila e a resposta traz o relatório
        da auditoria no campo `consistency`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdventureCreate'
      responses:
        '201':
          description: Aventura criada (estado completo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureState'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [adventures]
      summary: Listar aventuras (home)
      operationId: listAdventures
      responses:
        '200':
          description: Cards da home, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdventureSummary'

  /api/adventures/from-draft:
    post:
      tags: [adventures]
      summary: Criar cenário, aventura, ficha e ruleset numa transação
      operationId: createAdventureFromDraft
      description: |
        Grava o cenário e a aventura juntos, com a ação inicial, as fichas do
        rascunho e, quando vierem, a ficha do protagonista e o ruleset.
        O cenário nasce referenciado pela aventura (não fica órfão).
        Jobs de retrato e ficha incompleta rodam depois do commit: falha neles
        não desfaz a aventura. A resposta é o estado completo, com `consistency`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdventureFromDraft'
      responses:
        '201':
          description: Aventura criada (estado completo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureState'
        '401':
          description: Sem autenticação.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/export:
    get:
      tags: [import-export]
      summary: Backup de todas as aventuras visíveis
      operationId: exportAllAdventures
      description: |
        Um zip com uma pasta por aventura, no mesmo formato do export
        individual, restaurável por `POST /api/import/aidungeon`.
        Admin recebe todas; os demais, só as próprias.
        O header `X-Adventure-Count` traz quantas entraram.
      responses:
        '200':
          description: Arquivo zip.
          headers:
            X-Adventure-Count:
              schema:
                type: integer
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /api/adventures/{adventureId}:
    get:
      tags: [adventures]
      summary: Estado completo da aventura (para a UI)
      operationId: getAdventure
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Aventura + ações + cards + memórias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureState'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [adventures]
      summary: Editar metadados da aventura
      operationId: patchAdventure
      description: |
        Campos ausentes não mudam. `turn_mode` e `dm_mode` atualizam a mesa.
        Exige dono ou admin. Quem não vê a aventura recebe 404; quem vê e não
        é dono recebe 403.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdventureUpdate'
      responses:
        '200':
          description: Estado completo depois da edição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureState'
        '403':
          description: Jogador com acesso que não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [adventures]
      summary: Apagar a aventura e os dependentes
      operationId: deleteAdventure
      description: Remove ações, cards, memórias e o resto do save. Dono ou admin.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Aventura apagada.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        '403':
          description: Jogador com acesso que não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/intents:
    get:
      tags: [adventures]
      summary: Fila de intenções da mesa
      operationId: listIntents
      description: |
        Dono vê a fila inteira. Jogador compartilhado vê só as próprias.
        `status` default é `pending`.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
      responses:
        '200':
          description: Lista filtrada.
          content:
            application/json:
              schema:
                type: object
                required: [intents]
                properties:
                  intents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Intent'
        '400':
          description: invalid_status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/intents/{intentId}/approve:
    post:
      tags: [generation]
      summary: Aprovar intenção e gerar a ação — SSE
      operationId: approveIntent
      description: |
        Só o dono. Dispara a ação original (`do`/`say`/`story`) em nome de
        quem pediu e streama como `/action`. Intenção que não está `pending`
        responde 409 `intent_not_pending`. Com turno ligado, fora da vez do
        autor responde 409 `not_your_turn`.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: intentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stream SSE da geração.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: intent_not_pending ou not_your_turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/intents/{intentId}/reject:
    post:
      tags: [adventures]
      summary: Rejeitar intenção sem gerar texto
      operationId: rejectIntent
      description: Não cria action e não chama o LLM. A vez não anda. Só o dono.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: intentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intenção rejeitada.
          content:
            application/json:
              schema:
                type: object
                required: [intent]
                properties:
                  intent:
                    $ref: '#/components/schemas/Intent'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: intent_not_pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/sharing:
    get:
      tags: [adventures]
      summary: Dono, shares e modo de mesa
      operationId: getSharing
      description: Quem enxerga a aventura pode ler. Quem não enxerga recebe 404.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Vista de compartilhamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingView'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [adventures]
      summary: Compartilhar a aventura com outro usuário
      operationId: shareAdventure
      description: |
        Só o dono. Não compartilha com o próprio dono (400 `cannot_share_owner`).
        Usuário inexistente é 404 `user_not_found`. Repetido é 409 `already_shared`.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdventureShareCreate'
      responses:
        '201':
          description: Vista depois de incluir o jogador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingView'
        '400':
          description: cannot_share_owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: already_shared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/sharing/{username}:
    delete:
      tags: [adventures]
      summary: Tirar o acesso compartilhado
      operationId: unshareAdventure
      description: Só o dono. Se a vez era desse jogador, ela volta para o dono.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vista depois da remoção.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharingView'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/scripts:
    get:
      tags: [scripts]
      summary: Scripts da aventura e a fonte efetiva
      operationId: getAdventureScripts
      description: |
        Devolve o texto salvo na aventura, o global e `sources`
        (`adventure`, `global` ou `empty`). Não executa. String vazia na
        aventura não copia o global para ela; ausência da chave é que cai no global.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Scripts e fontes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureScripts'
        '403':
          description: Quem vê a aventura mas não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [scripts]
      summary: Gravar scripts da aventura
      operationId: putAdventureScripts
      description: |
        Valida no sandbox atual e grava. Não executa. Campo ausente não muda.
        String vazia apaga a chave da aventura para o script global voltar a valer.
        Violação do sandbox ou syntax error respondem 422 `script_rejected`.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdventureScriptsUpdate'
      responses:
        '200':
          description: Vista depois de gravar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureScripts'
        '403':
          description: Quem vê a aventura mas não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: script_rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # --------------------------------------------------------------- generation
  /api/adventures/{adventureId}/action:
    post:
      tags: [generation]
      summary: Enviar ação do jogador (Do/Say/Story) — SSE
      operationId: postAction
      description: |
        Persiste a ação do jogador e gera a continuação via LLM.

        Formatação aplicada antes de enviar ao modelo (PLANO.md §4.2):
        - `do`    → `\n> You {text}\n`
        - `say`   → `\n> You say "{text}"\n`
        - `story` → prosa pura

        **Resposta SSE (`text/event-stream`)** — sequência de eventos:
        ```
        event: token
        data: {"token": "You"}

        event: token
        data: {"token": " draw"}

        event: done
        data: {"player_action": {Action}, "action": {Action}}
        ```
        Em falha do LLM, o stream termina com:
        ```
        event: error
        data: {"message": "llm unreachable"}
        ```
        O evento `done` traz a action `continue` persistida (em `action`) e a
        ação do jogador persistida (em `player_action`).

        Com a checagem de viabilidade ligada (`action_check.enabled` em
        `config/settings.json`), o stream emite **antes** dos tokens:
        ```
        event: action_check
        data: {"possible": true, "blockers": [], "risks": [], "notes": "", "cost": "", "consequence": ""}
        ```
        O veredito também volta em `data.action_check` do evento `done`.
        Quando a checagem não roda (ação curta, tipo `story`, LLM fora do ar),
        o evento simplesmente não é emitido.

        Em `do`, `say` e `continue`, o stream emite **antes** dos tokens a
        decisão visível (`AdjudicationEvent`):
        ```
        event: adjudication
        data: {"decision":"refuse","outcome":"Mira recusa.","reactions":[{"npc":"Mira","card_id":"…","reaction":"recua","line":"Não.","emotion":"anger","pose":"step back"}],"initiative":null}
        ```
        Esse frame não traz `relation_changes` nem motivo oculto.
        O `done` repete a decisão como `TurnAdjudication`, com
        `relation_changes`. Cada mudança tem `card_id`, `name`, `target`,
        `delta`, `reason` e `evidence`: só o fato observável. Não existe campo
        de motivação oculta. `story` não adjudica. `retry` não emite o evento,
        não reaplica relação, visual ou memória e não dispara o pós-turno.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Stream SSE de tokens (`token`), encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
              example: "event: token\ndata: {\"token\": \"You\"}\n\nevent: done\ndata: {\"action\": {\"id\": 42, \"type\": \"continue\"}}\n\n"
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Já existe uma geração em andamento para esta aventura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/generation/cancel:
    post:
      tags: [generation]
      summary: Cancelar a geração em andamento
      operationId: cancelGeneration
      description: |
        Sinaliza o cancelamento até o provider e aguarda até 5 s pela liberação.
        Uma ação nova é removida; retry preserva a resposta anterior. Fechar
        apenas o stream não chama este endpoint e não cancela o turno.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Cancelamento concluído ou ainda em finalização.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [cancelling, cancelled]
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nenhuma geração ativa (no_generation_in_progress).

  /api/adventures/{adventureId}/continue:
    post:
      tags: [generation]
      summary: IA continua sozinha — SSE
      operationId: postContinue
      description: |
        Gera a continuação sem nova entrada do jogador. Mesmo formato SSE de
        `/action`. Pode emitir `adjudication` antes dos tokens quando alguém
        age por conta própria. O `done` traz `{"action": {Action}}` e, se houve
        decisão, `adjudication` (`TurnAdjudication`) com `relation_changes`
        observáveis.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Stream SSE de tokens, encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração em andamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/retry:
    post:
      tags: [generation]
      summary: Regenerar última resposta da IA — SSE
      operationId: postRetry
      description: |
        Substitui a última action `continue` por uma nova geração (mesmo
        contexto anterior a ela). Se a última ação não for da IA, responde 409.
        Não emite um frame `adjudication` novo, não reaplica memória, relação
        ou visual e não dispara o pós-turno. O `done` traz a action `continue`
        substituta (mesmo `seq`, novo `id`) e preserva a adjudicação anterior,
        sem `relation_changes` novo.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Stream SSE de tokens, encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Última ação não é regenerável ou geração em andamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/undo:
    post:
      tags: [adventures]
      summary: Desfazer último turno
      operationId: postUndo
      description: |
        Remove o último turno (a resposta da IA e, se houver, a ação do jogador
        que a originou) e devolve o que foi removido. Nunca remove a action
        `start` — nesse caso responde 409.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Turno removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nada a desfazer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ------------------------------------------------------------------ actions
  /api/actions/{actionId}:
    patch:
      tags: [actions]
      summary: Editar texto de qualquer ação (Edit)
      operationId: patchAction
      description: Atualiza `text` e marca `edited_at`. Vale também para respostas da IA.
      parameters:
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPatch'
      responses:
        '200':
          description: Ação atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # -------------------------------------------------------------------- cards
  /api/adventures/{adventureId}/cards:
    post:
      tags: [cards]
      summary: Criar story card
      operationId: createCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCardUpsert'
      responses:
        '201':
          description: Card criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [cards]
      summary: Listar story cards da aventura
      operationId: listCards
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Busca textual case-insensitive em título, triggers e entry
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Filtro por tipo de card (character, location, item, lore, etc.)
        - name: pinned
          in: query
          required: false
          schema:
            type: boolean
          description: Filtro por status fixado (pinned)
      responses:
        '200':
          description: Lista de cards (pinned primeiro).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/bulk:
    post:
      tags: [cards]
      summary: Executar operações em lote sobre story cards
      operationId: bulkCardsAction
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardBulkAction'
      responses:
        '200':
          description: Operação em lote concluída com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardBulkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/cards/{cardId}:
    get:
      tags: [cards]
      summary: Obter story card
      operationId: getCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [cards]
      summary: Atualizar story card (parcial)
      operationId: updateCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCardUpsert'
      responses:
        '200':
          description: Card atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [cards]
      summary: Remover story card
      operationId: deleteCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '204':
          description: Card removido.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/scene:
    post:
      tags: [assets]
      summary: Fundo e elenco da cena atual (enfileira quando lugar, clima, elenco ou estado visual muda)
      operationId: syncScene
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                retry:
                  type: boolean
                  description: true força outra pintura mesmo com fundo já pronto.
      responses:
        '200':
          description: |
            Lugar, clima, elenco (retratos) e estado do fundo
            (none/pending/ready/error/disabled). O estado visual atual do elenco
            entra no backdrop; números de vínculo sozinhos não geram outra imagem.
            Não bloqueia na geração.
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- assets
  # Pipeline assíncrono (v0.3.0): enfileira gerações; o worker (backend) executa
  # em background e a UI faz polling em GET .../jobs, aplicando cada asset ao
  # concluir. Criar aventura a partir de cenário já enfileira retratos dos NPCs.
  /api/adventures/{adventureId}/portraits:
    post:
      tags: [assets]
      summary: Enfileirar retrato só dos NPCs que ainda não têm foto (cards type=character)
      operationId: enqueueAllPortraits
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '202':
          description: Jobs enfileirados (dedupe — jobs ativos são reaproveitados).
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/{cardId}/portrait:
    post:
      tags: [assets]
      summary: (Re)gerar retrato de um NPC
      operationId: enqueuePortrait
      description: |
        Enfileira um job character_portrait. A primeira foto vira a âncora
        (portrait_anchor_id) e passa a ser a cara do NPC na cena, no dock e na ficha.
        Se o card já tem retrato, o job é img2img a partir desse PNG (o rosto não
        é sorteado de novo). Geração automática não substitui um retrato existente.
        As variantes do turno usam a ação, emoção, pose e estágio de relação de
        sheet.visual_state, sempre com a mesma âncora de identidade; a sequência
        do turno isolada não força GPU.
        Se o card não tiver portrait_prompt, o LLM escreve um a partir de entry
        + contexto da aventura (e o persiste no card). Prompt final = image_style
        da aventura + portrait_prompt + style_suffix.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum: [anchor, reference]
                  default: anchor
                  description: |
                    reference gera o retrato só a partir da foto enviada
                    (sheet.reference). Sem foto, 422 reference_required.
      responses:
        '202':
          description: Job enfileirado (ou job ativo existente — dedupe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: source=reference sem foto de referência (reference_required).
    delete:
      tags: [assets]
      summary: Apagar o retrato e a âncora do NPC
      operationId: deletePortrait
      description: |
        Apaga as linhas de imagem do retrato e da âncora, e os PNGs que
        continuarem dentro do repositório. 204 mesmo se já não havia retrato.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '204':
          description: Retrato apagado, ou já não havia retrato.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/{cardId}/enrich:
    post:
      tags: [assets]
      summary: (v0.5.0) Enriquecer a ficha do NPC via LLM
      operationId: enrichCard
      description: |
        O LLM gera a ficha estruturada (appearance, body, clothing, personality,
        stats {str..cha 1-20}, notes) a partir de entry + contexto da aventura
        (melhorando uma ficha existente sem contradizê-la) e um portrait_prompt
        detalhado. Síncrono; persiste sheet (JSON string) e portrait_prompt no card.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card atualizado (sheet + portrait_prompt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Resposta do LLM não interpretável (generation_failed) — tente de novo.

  /api/adventures/{adventureId}/cards/{cardId}/regenerate:
    post:
      tags: [assets]
      summary: Regenerar um campo da ficha, ou os nove textos vivos
      operationId: regenerateCard
      description: |
        scope=field regenera um campo de REGENERABLE_FIELDS
        (personality, humor, speech, goals, background, lifestyle, habits,
        likes, sentiments, portrait_prompt). Campo fora da lista: 422 invalid_field.
        scope=all preenche só os vazios quando overwrite=false, e substitui os
        nove textos quando overwrite=true. Não toca entry, appearance, body,
        clothing, status, stats nem notes. portrait_prompt só entra em scope=field.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRegenerateRequest'
      responses:
        '200':
          description: Card e a lista do que mudou.
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/StoryCard'
                  regenerated:
                    type: array
                    items:
                      type: string
                  skipped:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: invalid_field
        '503':
          description: generation_failed

  /api/adventures/{adventureId}/cards/{cardId}/reference:
    put:
      tags: [assets]
      summary: Enviar uma foto de referência do personagem
      operationId: uploadReference
      description: |
        Multipart com file e mode. mode=reference (padrão) grava sheet.reference
        e não marca pessoa real. mode=real_person também marca real_person e
        espelha o caminho em likeness. Limpa portrait_anchor_id e mantém o
        retrato atual. Menor continua recusado.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [reference, real_person]
                  default: reference
      responses:
        '200':
          description: Card atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '400':
          description: Imagem inválida ou mode inválido.
        '422':
          description: Menor (minor).
    delete:
      tags: [assets]
      summary: Apagar a foto de referência
      operationId: deleteReference
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: sheet.reference e o caminho do likeness zerados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'

  /api/adventures/{adventureId}/cards/{cardId}/reference/primary:
    post:
      tags: [assets]
      summary: Escolher a foto de referência principal
      operationId: setPrimaryReference
      description: image_path aponta para uma foto já gravada do card.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryReferenceRequest'
      responses:
        '200':
          description: Card atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/{cardId}/likeness/resolve:
    post:
      tags: [assets]
      summary: Resolver referência externa do personagem
      operationId: resolveLikeness
      description: |
        Busca uma foto de referência, grava em `data/references` e o descritor
        na ficha. `title` substitui a consulta. `force` refaz mesmo se já houver referência.
        Menor continua recusado.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Card com a referência aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Menor (minor) ou referência recusada.

  /api/adventures/{adventureId}/cards/{cardId}/memories:
    get:
      tags: [assets]
      summary: Memórias recentes do NPC
      operationId: listNpcMemories
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Até 20 memórias, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items:
                      $ref: '#/components/schemas/NpcMemory'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/life/tick:
    post:
      tags: [adventures]
      summary: Enfileirar um dia fora de cena
      operationId: tickNpcLife
      description: Não roda o LLM no request. O worker executa npc_day_tick.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '202':
          description: Job enfileirado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/character:
    get:
      tags: [cards]
      summary: Ficha do personagem de quem está logado
      operationId: getPlayerCharacter
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Card do personagem do jogador (null se ainda não criou).
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    allOf:
                      - $ref: '#/components/schemas/StoryCard'
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [cards]
      summary: Criar ou atualizar o personagem de quem está logado
      description: |
        A ficha é normalizada: `class` é gravado pelo alias e as seis
        habilidades saem sempre preenchidas — números enviados são
        normalizados (1–20) e stats vazios são estimados pela classe,
        aparência e notas. Chaves extras (`hp`, por exemplo) seguem como vieram.
      operationId: putPlayerCharacter
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCharacterUpsert'
      responses:
        '200':
          description: Card salvo (id e retrato preservados).
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/characters:
    get:
      tags: [cards]
      summary: Personagens dos jogadores da mesa
      operationId: listPlayerCharacters
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Um card por jogador da mesa.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    card:
                      $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/consistency:
    get:
      tags: [consistency]
      summary: Auditar o cruzamento entre ficha, retrato, imagem, memória e embedding
      description: |
        Roda as verificações do projeto (ficha viva do NPC, prompt/portrait,
        memórias vetorizadas, mente do NPC, cânone do mundo e alinhamento entre a
        cena do feed e o fundo do painel) e devolve o relatório.
      operationId: getConsistency
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Relatório das verificações.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyReport'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/consistency/repair:
    post:
      tags: [consistency]
      summary: Reparar uma verificação quebrada
      description: Refaz fichas incompletas, prompts/retratos divergentes e memórias sem embedding.
      operationId: repairConsistency
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [check]
              properties:
                check:
                  type: string
                  enum: [card_sheets, portraits, memories]
                  description: Verificação a reparar (as demais são informativas).
      responses:
        '200':
          description: O que foi refeito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsistencyRepair'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/jobs:
    get:
      tags: [assets]
      summary: Listar jobs da aventura (polling da UI)
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [preparing, pending, running, done, error, canceled]
      responses:
        '200':
          description: Fila em ordem de criação.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/jobs/{jobId}:
    get:
      tags: [assets]
      summary: Obter job
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [assets]
      summary: Cancelar job que ainda não roda (preparing ou pending)
      operationId: cancelJob
      description: Jobs running são devolvidos sem alteração (cancelamento cooperativo — v1); jobs finalizados dão 409 job_not_cancelable. Publica job_progress canceled.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job cancelado (ou running, sem alteração).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Job já finalizado (error.code = job_not_cancelable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{jobId}:
    get:
      tags: [assets]
      summary: Obter job pelo id (polling do See assíncrono, contrato C6)
      operationId: getJobById
      description: Job de história de outra pessoa responde 404, como um id que não existe.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/jobs/{jobId}/cancel:
    post:
      tags: [assets]
      summary: Cancelar job pelo id, inclusive render em execução
      operationId: cancelJobById
      description: |
        preparing/pending são cancelados imediatamente. Em running, publica o
        cancelamento e usa /sdapi/v1/interrupt para SDWebUI; resultado tardio
        não grava imagem/action nem emite evento ready. Repetir é idempotente.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Job já concluído ou com erro.
  # ------------------------------------------------------------------- memory

  /api/adventures/{adventureId}/memory:
