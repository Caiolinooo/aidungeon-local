          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/publications/{publicationId}/like:
    post:
      tags: [publications]
      summary: Curtir
      operationId: likePublication
      parameters:
        - name: publicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado do like.
          content:
            application/json:
