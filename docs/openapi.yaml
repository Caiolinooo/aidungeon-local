        sdwebui_steps:
          type: integer
        sdwebui_width:
          type: integer
        sdwebui_height:
          type: integer
        comfyui_base_url:
          type: string
          example: http://127.0.0.1:8188
        comfyui_steps:
          type: integer
          example: 15
        comfyui_width:
          type: integer
          example: 1024
        comfyui_height:
          type: integer
          example: 1024
        negative_prompt:
          type: string
        openai_base_url:
          type: string
        openai_api_key:
          type: string
          nullable: true
          description: Sempre mascarada.
        openai_model:
          type: string
        openai_size:
          type: string
          example: 512x512
        style_suffix:
          type: string
        seed:
          type: integer
          nullable: true
        variation:
          type: integer
          minimum: 0
        cfg_scale:
          type: number
        sampler_name:
          type: string
        scheduler:
          type: string
        denoising_strength:
          type: number
        timeout_seconds:
          type: integer
        sd_model_checkpoint:
          type: string

    ImageSettingsUpdate:
      type: object
      description: Campos omitidos permanecem.
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [sdwebui, comfyui, openai_compatible]
        sdwebui_base_url:
          type: string
        sdwebui_steps:
          type: integer
        sdwebui_width:
          type: integer
        sdwebui_height:
          type: integer
        comfyui_base_url:
          type: string
        comfyui_steps:
          type: integer
        comfyui_width:
          type: integer
        comfyui_height:
          type: integer
        negative_prompt:
          type: string
        openai_base_url:
          type: string
        openai_api_key:
          type: string
          nullable: true
          description: String vazia remove; omitir mantém.
        openai_model:
          type: string
        openai_size:
          type: string
        style_suffix:
          type: string
        seed:
          type: integer
          nullable: true
          description: Null remove o override; omitido mantém.
        variation:
          type: integer
          minimum: 0
        cfg_scale:
          type: number
          minimum: 1
          maximum: 30
        sampler_name:
          type: string
        scheduler:
          type: string
        denoising_strength:
          type: number
          minimum: 0
          maximum: 1
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
        sd_model_checkpoint:
          type: string

    VoiceList:
      type: object
      properties:
        voices:
          type: array
          items:
            type: string
          example: [M1, M2, M3, F1, F2, F3]
        narrator_voice:
          type: string
          example: M1
        cloned:
          type: array
          description: Clones do próprio usuário; admin vê todos.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              owner:
                type: string
              ref_text:
                type: string
              seconds:
                type: number

    TtsRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Texto a sintetizar (até max_text_chars).
        voice:
          type: string
          nullable: true
          description: Voz TTS (M1–M3, F1–F3); omitida usa narrator_voice.
        emotion:
          type: string
          nullable: true
          description: >
            Dica de emoção (joy, anger, fear, sadness, tenderness, surprise,
            disgust, neutral; apelidos happy/sad/angry/love também). A linha
            vence. Omitida, o servidor escolhe.
        adventure_id:
          type: string
          nullable: true
          description: >
            Se a linha não declara emoção, a ficha do NPC citado nesta
            aventura entra na escolha. Id desconhecido é ignorado.

    SttResult:
      type: object
      properties:
        text:
          type: string
          description: Transcrição do áudio (formato OpenAI whisper).

    VoiceSettings:
      type: object
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
          example: https://vm.groupabz.com/voice/v1
        tts_model:
          type: string
          example: supertonic-3
        stt_model:
          type: string
          example: whisper-1
        narrator_voice:
          type: string
          example: M1
        voices:
          type: array
          items:
            type: string
        timeout_seconds:
          type: integer
        max_text_chars:
          type: integer
        stt_max_bytes:
          type: integer
        api_key:
          type: string
          nullable: true
          description: Sempre mascarada.
        api_key_set:
          type: boolean
          description: true se há chave efetiva (override ou env VOICE_API_KEY).
        drama3_model:
          type: string
          example: drama-3
        drama3_enabled:
          type: boolean
          description: >
            false nesta VM: o Drama-3 não cabe na L4 junto com o narrador
            e o gerador de imagem. A fala segue no tts_model.

    VoiceSettingsUpdate:
      type: object
      description: Campos omitidos permanecem.
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
        tts_model:
          type: string
        stt_model:
          type: string
        narrator_voice:
          type: string
          description: Fora da lista voices → 400 invalid_voice.
        timeout_seconds:
          type: integer
        api_key:
          type: string
          nullable: true
          description: String vazia remove; omitir mantém.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: adventure 3f2a... not found
            hint:
              type: string
              description: |
                Opcional e aditivo. Nas rotas do assistente, o detalhe real da
                falha de geração (resposta sem title, resposta sem story_cards)
                vai aqui; `code` e `message` permanecem o contrato estável.

    AdventureFromDraft:
      type: object
      required: [draft]
      description: |
        POST /api/adventures/from-draft — cenário, aventura, ficha e ruleset
        numa transação.
      properties:
        draft:
          $ref: '#/components/schemas/ScenarioCreate'
        character:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlayerCharacterUpsert'
        ruleset_id:
          type: string
          nullable: true

    CharacterSheet:
      type: object
      description: |
        Ficha do personagem. `class` é a classe/arquétipo (alias do campo
        interno `class_`); `stats` traz as seis habilidades e aceita chaves
        extras. O backend completa o que faltar: status, stats estimados pela
        classe/apresentação/notas e a classe a partir do texto.
      properties:
        appearance:
          type: string
        body:
          type: string
        clothing:
          type: string
        status:
          type: string
        class:
          type: string
          example: Ladino
        notes:
          type: string
        stats:
          type: object
          description: str/dex/con/int/wis/cha em 1–20 + chaves extras livres.
          additionalProperties: true
          example: {str: 12, dex: 15, con: 12, int: 10, wis: 11, cha: 13}

    PlayerCharacterUpsert:
      type: object
      required: [title, sheet]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        sheet:
          $ref: '#/components/schemas/CharacterSheet'
        portrait_prompt:
          type: string
          nullable: true

    ConsistencyCheck:
      type: object
      required: [id, name, status, detail, items]
      properties:
        id:
          type: string
          enum: [card_sheets, portraits, memories, npc_minds, canon_world, scene_alignment]
        name:
          type: string
          example: Fichas dos NPCs
        status:
          type: string
          enum: [ok, warn, error]
        detail:
          type: string
        items:
          type: array
          items:
            type: object
            description: Item quebrado (o formato varia por verificação).
            additionalProperties: true

    ConsistencyReport:
      type: object
      required: [ok, adventure_id, checks, counts]
      properties:
        ok:
          type: boolean
          description: true quando nenhuma verificação está em warn/error.
        adventure_id:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ConsistencyCheck'
        counts:
          type: object
          properties:
            ok:
              type: integer
            warn:
              type: integer
            error:
              type: integer

    ConsistencyRepair:
      type: object
      required: [check, repaired, errors]
      properties:
        check:
          type: string
          enum: [card_sheets, portraits, memories]
        repaired:
          type: array
          description: Itens refeitos.
          items:
            type: object
            additionalProperties: true
        errors:
          type: array
          description: Itens que não puderam ser reparados.
          items:
            type: string

    Ruleset:
      type: object
      required: [id, name, rules, builtin]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          default: ''
        rules:
          type: string
          maxLength: 4000
        builtin:
          type: boolean
          description: true nos seis sistemas do seed. Cópias aplicadas na aventura são texto independente.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RulesetUpsert:
      type: object
      description: POST exige name e rules. PUT aceita qualquer subconjunto. Campos ausentes no PUT não mudam.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        rules:
          type: string
          minLength: 1
          maxLength: 4000

    RulesetApply:
      type: object
      required: [ruleset_id]
      properties:
        ruleset_id:
          type: string
        mode:
          type: string
          enum: [replace, append]
          default: replace

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    OkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Za-z][A-Za-z0-9_-]{1,31}$'
        password:
          type: string
          minLength: 8

    UserPassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8

    UserAccount:
      type: object
      required: [username, role, adventure_count]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        created_at:
          type: string
          format: date-time
        adventure_count:
          type: integer

    AdventureUpdate:
      type: object
      description: Campos ausentes não mudam.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        ai_instructions:
          type: string
        plot_essentials:
          type: string
        authors_note:
          type: string
        story_summary:
          type: string
        image_style:
          type: string
        third_person:
          type: boolean
        turn_mode:
          type: boolean
        dm_mode:
          type: boolean
        character_rules:
          type: string
          maxLength: 4000

    AdventureShareCreate:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32

    SharingView:
      type: object
      required: [owner, participants, shares, turn_mode, turn_user, dm_mode]
      properties:
        owner:
          type: string
        participants:
          type: array
          description: Dono primeiro, depois os shares.
          items:
            type: string
        shares:
          type: array
          items:
            type: string
        turn_mode:
          type: boolean
        turn_user:
          type: string
        dm_mode:
          type: boolean

    Intent:
      type: object
      required: [id, adventure_id, username, type, text, status]
      properties:
        id:
          type: string
        adventure_id:
          type: string
        username:
          type: string
        type:
          type: string
          enum: [do, say, story]
        text:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        action_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          type: string

    ScriptHooks:
      type: object
      properties:
        input_modifier:
          type: string
        context_modifier:
          type: string
        output_modifier:
          type: string

    AdventureScriptsUpdate:
      type: object
      description: Campo ausente não muda. String vazia apaga a chave da aventura.
      properties:
        input_modifier:
          type: string
        context_modifier:
          type: string
        output_modifier:
          type: string

    AdventureScripts:
      allOf:
        - $ref: '#/components/schemas/ScriptHooks'
        - type: object
          required: [sources, global]
          properties:
            sources:
              type: object
              description: O que o turno vai usar em cada hook.
              additionalProperties:
                type: string
                enum: [adventure, global, empty]
            global:
              $ref: '#/components/schemas/ScriptHooks'

    EmbeddingsSettings:
      type: object
      required: [enabled, base_url, model, timeout_seconds]
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
        model:
          type: string
        timeout_seconds:
          type: integer

    EmbeddingsSettingsUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
        model:
          type: string
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600

    PrimaryReferenceRequest:
      type: object
      required: [image_path]
      properties:
        image_path:
          type: string

    AssistantCardRequest:
      type: object
      required: [concept]
      properties:
        concept:
          type: string
          minLength: 2
        card_type:
          type: string
          default: character
        adventure_id:
          type: string
          nullable: true
        draft:
          type: object
          additionalProperties: true
          nullable: true
        current_card:
          type: object
          additionalProperties: true
          nullable: true
        instruction:
          type: string
          nullable: true
        web_search:
          type: boolean
          default: false
        language:
          type: string
          default: pt

    AssistantCardResponse:
      type: object
      required: [card, web_sources]
      properties:
        card:
          type: object
          additionalProperties: true
        web_sources:
          type: array
          items:
            $ref: '#/components/schemas/WebSearchHit'

    AssistantSyncPlotRequest:
      type: object
      required: [adventure_id]
      properties:
        adventure_id:
          type: string
        instruction:
          type: string
          nullable: true
        language:
          type: string
          default: pt

    AssistantSyncPlotResponse:
      type: object
      required: [plot_essentials, authors_note, summary_delta]
      properties:
        plot_essentials:
          type: string
        authors_note:
          type: string
        summary_delta:
          type: string

    WebSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
        language:
          type: string
          default: pt
        max_results:
          type: integer
          minimum: 1
          maximum: 10
          default: 5

    WebSearchHit:
      type: object
      required: [title, url, snippet, source]
      properties:
        title:
          type: string
        url:
          type: string
        snippet:
          type: string
        source:
          type: string

    WebSearchResponse:
      type: object
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/WebSearchHit'

    ClonedVoice:
      type: object
      required: [id, name, ref_text, seconds]
      properties:
        id:
          type: string
        name:
          type: string
        ref_text:
          type: string
        seconds:
          type: number

    SimState:
      type: object
      required: [pack, packs, foes, quests, triggers]
      properties:
        pack:
          type: string
          description: Vazio quando as regras estão desligadas.
        packs:
          type: array
          items:
            type: object
            additionalProperties: true
        actor:
          type: object
          nullable: true
          additionalProperties: true
        foes:
          type: array
          items:
            type: object
            additionalProperties: true
        life:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SimLifeClock'
        quests:
          type: array
          items:
            $ref: '#/components/schemas/Quest'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/QuestTrigger'

    SimLifeClock:
      type: object
      properties:
        enabled:
          type: boolean
        running:
          type: boolean
        speed:
          type: integer
        day:
          type: integer
        minute:
          type: integer
        clock:
          type: string
        weekday:
          type: string
        season:
          type: string
        npcs:
          type: array
          items:
            type: object
            additionalProperties: true
        relations:
          type: array
          items:
            type: object
            additionalProperties: true
        reactions:
          type: array
          items:
            type: object
            additionalProperties: true

    SimPackUpdate:
      type: object
      properties:
        pack:
          type: string
          enum: ['', d20, d100]
          default: ''

    SimLifeUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        wage_per_hour:
          type: integer
          default: 5
          minimum: 0
          maximum: 100000

    SimAdvance:
      type: object
      required: [minutes, activity]
      properties:
        minutes:
          type: integer
          minimum: 1
          maximum: 720
        activity:
          type: string
          enum: [eat, sleep, rest, wash, social, fun, work, bladder, other]

    SimActorUpdate:
      type: object
      properties:
        resync:
          type: boolean
          default: false
        abilities:
          type: object
          additionalProperties:
            type: integer
        skills:
          type: object
          additionalProperties:
            type: integer
        proficient:
          type: array
          items:
            type: string
        inventory:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              qty:
                type: integer
                default: 1
        hp:
          type: integer
        hp_max:
          type: integer
        gold:
          type: integer
        level:
          type: integer
        xp:
          type: integer

    SimRollRequest:
      type: object
      required: [expr]
      properties:
        expr:
          type: string
        mode:
          type: string
          enum: ['', adv, dis]
          default: ''

    SimRollResult:
      type: object
      required: [expr, rolls, modifier, total]
      properties:
        expr:
          type: string
        rolls:
          type: array
          items:
            type: integer
        modifier:
          type: integer
        total:
          type: integer

    SimActionRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [attack, skill, save, use_item, buy, take, rest]
        target:
          type: string
          default: ''
        toughness:
          type: string
          default: normal
        hostile:
          type: boolean
          default: false
        weapon:
          type: string
          default: ''
        item:
          type: string
          default: ''
        skill:
          type: string
          default: ''
        ability:
          type: string
          default: ''
        gold:
          type: integer
          default: 0
        difficulty:
          type: string
          default: medium
        advantage:
          type: string
          default: ''
        minutes:
          type: integer
          default: 5
        heal:
          type: boolean
          default: false

    SimActionResponse:
      allOf:
        - $ref: '#/components/schemas/SimState'
