openapi: 3.0.3
info:
  title: AI Dungeon Local — API
  version: 0.4.0
  description: |
    API REST do clone local do AI Dungeon (PLANO.md §4.4).

    Convenções gerais:
    - Todos os endpoints respondem JSON (`application/json`), exceto:
      - os endpoints de geração (`/action`, `/continue`, `/retry`), que respondem
        `text/event-stream` (SSE) — ver tag `generation`;
      - `/api/adventures/{id}/export`, que responde `application/zip`.
    - Booleans do banco (INTEGER 0/1) são expostos como `true/false`.
    - Campos `tags` e `triggers` são TEXT JSON no banco, expostos como arrays.
    - Timestamps em ISO-8601 UTC.
    - Erros seguem o schema `Error`.
  contact:
    name: AI Dungeon Local (self-hosted)
servers:
  - url: http://127.0.0.1:8000
    description: backend local (FastAPI)

tags:
  - name: auth
    description: Login e verificação de token. Todas as demais rotas /api exigem Bearer.
  - name: scenarios
  - name: adventures
  - name: generation
    description: Endpoints que geram texto via LLM e streamam por SSE.
  - name: actions
  - name: cards
  - name: memory
  - name: import-export
  - name: settings
    description: Área de configuração do servidor LLM (endpoint, chave, modelo, tokens).
  - name: assistant
    description: Assistente de criação de cenários (geração estruturada via LLM).
  - name: images
    description: Geração de imagens da cena (ação "See") — provedor sdwebui local/LAN ou endpoint OpenAI-compatible.
  - name: assets
    description: Pipeline assíncrono de assets (v0.3.0) — fila de jobs que gera retratos de NPCs em background; a UI faz polling e aplica cada asset ao concluir.
  - name: voice
    description: Voz (v0.4.0) — TTS Supertonic e STT Whisper via stack OpenAI-compatível da VM; /tts devolve bytes audio/mpeg (não JSON).
  - name: health

# Toda rota /api exige Bearer token, exceto as marcadas com `security: []` (login).
# Arquivos estáticos da SPA (fora de /api) são públicos — a página de login precisa carregar.
security:
  - bearerAuth: []

paths:
  # --------------------------------------------------------------------- auth
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login — devolve token Bearer
      operationId: login
      security: []
      description: |
        Valida username/senha contra AUTH_USER e AUTH_PASSWORD_HASH (sha256)
        do ambiente. Sucesso devolve token HMAC-SHA256 assinado com AUTH_SECRET
        (TTL de settings.auth.token_ttl_hours). Falha devolve 401 genérico
        (não distingue usuário de senha).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/check:
    get:
      tags: [auth]
      summary: Verificar se o token atual é válido
      operationId: checkAuth
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  user:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'


  # ---------------------------------------------------------------- scenarios
  /api/scenarios:
    post:
      tags: [scenarios]
      summary: Criar scenario
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '201':
          description: Scenario criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [scenarios]
      summary: Listar scenarios (biblioteca, com busca por tag)
      operationId: listScenarios
      parameters:
        - name: tag
          in: query
          description: Filtra scenarios que contêm a tag.
          schema:
            type: string
        - name: q
          in: query
          description: Busca textual em título/descrição.
          schema:
            type: string
      responses:
        '200':
          description: Lista de scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'

  /api/scenarios/{scenarioId}:
    get:
      tags: [scenarios]
      summary: Obter scenario por id
      operationId: getScenario
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '200':
          description: Scenario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- adventures
  /api/adventures:
    post:
      tags: [adventures]
      summary: Nova aventura (a partir de scenario ou vazia)
      operationId: createAdventure
      description: |
        Com `scenario_id`, copia os campos do scenario para a aventura e grava
        a action inicial (`type=start`, texto = `opening_text` do scenario).
        Sem `scenario_id`, cria aventura em branco.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdventureCreate'
      responses:
        '201':
          description: Aventura criada (estado completo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureState'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [adventures]
      summary: Listar aventuras (home)
      operationId: listAdventures
      responses:
        '200':
          description: Cards da home, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdventureSummary'

  /api/adventures/{adventureId}:
    get:
      tags: [adventures]
      summary: Estado completo da aventura (para a UI)
      operationId: getAdventure
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Aventura + ações + cards + memórias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdventureState'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- generation
  /api/adventures/{adventureId}/action:
    post:
      tags: [generation]
      summary: Enviar ação do jogador (Do/Say/Story) — SSE
      operationId: postAction
      description: |
        Persiste a ação do jogador e gera a continuação via LLM.

        Formatação aplicada antes de enviar ao modelo (PLANO.md §4.2):
        - `do`    → `\n> You {text}\n`
        - `say`   → `\n> You say "{text}"\n`
        - `story` → prosa pura

        **Resposta SSE (`text/event-stream`)** — sequência de eventos:
        ```
        event: token
        data: {"token": "You"}

        event: token
        data: {"token": " draw"}

        event: done
        data: {"player_action": {Action}, "action": {Action}}
        ```
        Em falha do LLM, o stream termina com:
        ```
        event: error
        data: {"message": "llm unreachable"}
        ```
        O evento `done` traz a action `continue` persistida (em `action`) e a
        ação do jogador persistida (em `player_action`).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Stream SSE de tokens (`token`), encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
              example: "event: token\ndata: {\"token\": \"You\"}\n\nevent: done\ndata: {\"action\": {\"id\": 42, \"type\": \"continue\"}}\n\n"
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Já existe uma geração em andamento para esta aventura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/adventures/{adventureId}/continue:
    post:
      tags: [generation]
      summary: IA continua sozinha — SSE
      operationId: postContinue
      description: |
        Gera a continuação sem nova entrada do jogador. Mesmo formato SSE de
        `/action`; o evento `done` traz apenas `{"action": {Action}}`
        (a action `continue` persistida).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Stream SSE de tokens, encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração em andamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/retry:
    post:
      tags: [generation]
      summary: Regenerar última resposta da IA — SSE
      operationId: postRetry
      description: |
        Substitui a última action `continue` por uma nova geração (mesmo
        contexto anterior a ela). Se a última ação não for da IA, responde 409.
        Mesmo formato SSE de `/action`; o evento `done` traz a action
        `continue` substituta (mesmo `seq`, novo `id`).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Stream SSE de tokens, encerrando com `done` ou `error`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseStream'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Última ação não é regenerável ou geração em andamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/undo:
    post:
      tags: [adventures]
      summary: Desfazer último turno
      operationId: postUndo
      description: |
        Remove o último turno (a resposta da IA e, se houver, a ação do jogador
        que a originou) e devolve o que foi removido. Nunca remove a action
        `start` — nesse caso responde 409.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Turno removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nada a desfazer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ------------------------------------------------------------------ actions
  /api/actions/{actionId}:
    patch:
      tags: [actions]
      summary: Editar texto de qualquer ação (Edit)
      operationId: patchAction
      description: Atualiza `text` e marca `edited_at`. Vale também para respostas da IA.
      parameters:
        - $ref: '#/components/parameters/ActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPatch'
      responses:
        '200':
          description: Ação atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # -------------------------------------------------------------------- cards
  /api/adventures/{adventureId}/cards:
    post:
      tags: [cards]
      summary: Criar story card
      operationId: createCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCardUpsert'
      responses:
        '201':
          description: Card criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [cards]
      summary: Listar story cards da aventura
      operationId: listCards
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Lista de cards (pinned primeiro).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/{cardId}:
    get:
      tags: [cards]
      summary: Obter story card
      operationId: getCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [cards]
      summary: Atualizar story card (parcial)
      operationId: updateCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCardUpsert'
      responses:
        '200':
          description: Card atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [cards]
      summary: Remover story card
      operationId: deleteCard
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '204':
          description: Card removido.
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- assets
  # Pipeline assíncrono (v0.3.0): enfileira gerações; o worker (backend) executa
  # em background e a UI faz polling em GET .../jobs, aplicando cada asset ao
  # concluir. Criar aventura a partir de cenário já enfileira retratos dos NPCs.
  /api/adventures/{adventureId}/portraits:
    post:
      tags: [assets]
      summary: Enfileirar geração de retrato para todos os NPCs (cards type=character)
      operationId: enqueueAllPortraits
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '202':
          description: Jobs enfileirados (dedupe — jobs ativos são reaproveitados).
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/{cardId}/portrait:
    post:
      tags: [assets]
      summary: (Re)gerar retrato de um NPC
      operationId: enqueuePortrait
      description: |
        Enfileira um job character_portrait. Se o card não tiver portrait_prompt,
        o LLM escreve um a partir de entry + contexto da aventura (e o persiste no
        card). Prompt final = image_style da aventura + portrait_prompt + style_suffix
        (mesma config efetiva da ação "See").
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '202':
          description: Job enfileirado (ou job ativo existente — dedupe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/cards/{cardId}/enrich:
    post:
      tags: [assets]
      summary: (v0.5.0) Enriquecer a ficha do NPC via LLM
      operationId: enrichCard
      description: |
        O LLM gera a ficha estruturada (appearance, body, clothing, personality,
        stats {str..cha 1-20}, notes) a partir de entry + contexto da aventura
        (melhorando uma ficha existente sem contradizê-la) e um portrait_prompt
        detalhado. Síncrono; persiste sheet (JSON string) e portrait_prompt no card.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card atualizado (sheet + portrait_prompt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Resposta do LLM não interpretável (generation_failed) — tente de novo.

  /api/adventures/{adventureId}/jobs:
    get:
      tags: [assets]
      summary: Listar jobs da aventura (polling da UI)
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, done, error, canceled]
      responses:
        '200':
          description: Fila em ordem de criação.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/jobs/{jobId}:
    get:
      tags: [assets]
      summary: Obter job
      operationId: getJob
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [assets]
      summary: Cancelar job pendente
      operationId: cancelJob
      description: Jobs running são devolvidos sem alteração (cancelamento cooperativo — v1); jobs finalizados dão 409 job_not_cancelable.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job cancelado (ou running, sem alteração).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Job já finalizado (error.code = job_not_cancelable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ------------------------------------------------------------------- memory
  /api/adventures/{adventureId}/memory:
    get:
      tags: [memory]
      summary: Ler Plot Essentials + Author's Note
      operationId: getMemory
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Estado de memória editável (+ story_summary somente leitura).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryState'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [memory]
      summary: Gravar Plot Essentials + Author's Note
      operationId: putMemory
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdate'
      responses:
        '200':
          description: Memória atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryState'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------ import/export
  /api/import/aidungeon:
    post:
      tags: [import-export]
      summary: Importar backup do AI Dungeon (.zip)
      operationId: importAidungeon
      description: |
        Recebe o `.zip` do backup oficial (multipart). O importador
        (PLANO.md §2.1/§4.6) lê `metadata.json` + `actions-*.json` (ordenados
        por `partNumber`), cria scenario implícito + aventura, e insere ações
        na ordem do array (`seq` 0..N), story cards (triggers = split/trim de
        `keys`) e memórias. Um JSON solto de story cards pode acompanhar o zip
        para merge/validação.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Backup .zip exportado do AI Dungeon.
      responses:
        '201':
          description: Importação concluída (relatório).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '400':
          description: Arquivo inválido ou formato não reconhecido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/export:
    get:
      tags: [import-export]
      summary: Exportar aventura NO MESMO FORMATO do backup
      operationId: exportAdventure
      description: |
        Gera um `.zip` byte-compatível com o formato de backup do AI Dungeon
        (`metadata.json` + `actions-001.json`, ...), permitindo round-trip
        import → export → import.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Zip no formato de backup do AI Dungeon.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------ settings
  /api/settings/llm:
    get:
      tags: [settings]
      summary: Ler configuração do servidor LLM
      operationId: getLlmSettings
      description: |
        Devolve a config efetiva (arquivo `config/settings.json` + overrides
        persistidos na tabela `settings` do banco). `api_key` nunca é devolvida
        em claro — vem mascarada (`"sk-…1234"`) ou `null`.
      responses:
        '200':
          description: Configuração atual do LLM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettings'
    put:
      tags: [settings]
      summary: Atualizar configuração do servidor LLM
      operationId: putLlmSettings
      description: |
        Persiste overrides na tabela `settings` (prevalecem sobre o arquivo).
        Campos omitidos permanecem. Após mudar `base_url`/`model_alias`, o
        backend refaz a descoberta de modelo (`GET {base_url}/models`).
        `api_key` é armazenada localmente e nunca exposta em logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada (com modelo redescoberto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettings'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------ assistant
  /api/assistant/scenario:
    post:
      tags: [assistant]
      summary: Gerar rascunho completo de cenário a partir de uma ideia
      operationId: assistantScenario
      description: |
        Recebe uma ideia em linguagem natural (`brief`, PT ou EN) e devolve um
        rascunho ESTRUTURADO completo (título, descrição, ai_instructions,
        plot_essentials, authors_note, opening_text, tags e story cards
        iniciais). NÃO persiste nada — o frontend revisa e depois chama
        POST /api/scenarios. Campos de texto narrativo são gerados em inglês
        (convenção do jogo); `brief` pode ser em qualquer idioma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantScenarioRequest'
      responses:
        '200':
          description: Rascunho gerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDraft'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assistant/field:
    post:
      tags: [assistant]
      summary: Regenerar um campo do rascunho (ou sugerir story cards)
      operationId: assistantField
      description: |
        Regenera UM campo mantendo coerência com o resto do rascunho enviado.
        `field=story_cards` devolve array de cards (merge/substituição é
        decisão do frontend).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantFieldRequest'
      responses:
        '200':
          description: Campo regenerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantFieldResponse'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # -------------------------------------------------------------------- images
  /api/adventures/{adventureId}/see:
    post:
      tags: [images]
      summary: Gerar imagem da cena (ação "See")
      operationId: postSee
      description: |
        Fluxo: (1) o LLM resume a cena recente (até settings.image.prompt_builder
        .max_scene_chars) em um prompt de imagem EN, prefixado por
        adventures.image_style; (2) chama o provedor configurado
        (settings.image.provider: `sdwebui` → POST {base_url}/sdapi/v1/txt2img;
        `openai_compatible` → POST {base_url}/images/generations com Bearer);
        (3) salva o arquivo em settings.image.storage_dir/<adventure_id>/;
        (4) grava linha em `images` e uma action `type=see` (text = prompt
        resumido) vinculada pelo mesmo seq; (5) devolve a imagem.
        Resposta JSON (não-SSE); geração local pode levar minutos — o frontend
        mostra spinner. 503 se provider inalcançável; 409 se geração de imagem
        já em andamento para a aventura.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeeRequest'
      responses:
        '200':
          description: Imagem gerada e vinculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração de imagem em andamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provedor de imagem indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/choices:
    post:
      tags: [generation]
      summary: Sugerir próximas ações para o jogador
      operationId: postChoices
      description: |
        Após ler a cena recente, o LLM sugere `settings.choices.count`
        (default 3) opções curtas de próxima ação — array JSON de
        {type: do|say|story, text ≤ 120 chars}, textos em inglês.
        Sem body. Quando `settings.choices.enabled=false` devolve
        200 {"choices": []}. Usa o mesmo lock por aventura da geração
        (action/continue/retry/see).
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Opções sugeridas (ou lista vazia se desabilitado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChoicesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Geração em andamento para a aventura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LLM indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/images/{imageId}:
    get:
      tags: [images]
      summary: Servir arquivo de imagem gerado
      operationId: getImage
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Arquivo da imagem.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/settings/image:
    get:
      tags: [settings]
      summary: Ler configuração de geração de imagens
      operationId: getImageSettings
      responses:
        '200':
          description: Config efetiva (api_key mascarada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSettings'
    put:
      tags: [settings]
      summary: Atualizar configuração de geração de imagens
      operationId: putImageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSettings'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------- voice
  /api/voices:
    get:
      tags: [voice]
      summary: Listar vozes TTS disponíveis + voz do narrador
      operationId: listVoices
      responses:
        '200':
          description: Vozes da config efetiva (settings.voice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceList'

  /api/tts:
    post:
      tags: [voice]
      summary: Sintetizar texto em áudio (mp3)
      operationId: postTts
      description: |
        Chama `POST {voice.base_url}/audio/speech` (Supertonic, formato OpenAI
        TTS) e devolve os bytes em passthrough. `voice` omitida (null) usa
        `narrator_voice` da config. Validações: `voice_disabled` (400),
        `invalid_payload` (texto vazio, 400), `text_too_long` (acima de
        max_text_chars, 400), `invalid_voice` (fora da lista ou '', 400).
        Provider indisponível → 502 (`unreachable`/`auth_error`/`error`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsRequest'
      responses:
        '200':
          description: Áudio sintetizado (bytes mp3, NÃO JSON).
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Validação (voice_disabled/invalid_payload/text_too_long/invalid_voice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider de voz indisponível ou erro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stt:
    post:
      tags: [voice]
      summary: Transcrever áudio (Whisper)
      operationId: postStt
      description: |
        Multipart campo `file` (webm/ogg/mp3/wav/m4a). Repassa ao provider
        `POST {voice.base_url}/audio/transcriptions` com model=stt_model e
        devolve `{"text": ...}` (formato OpenAI whisper). Validações:
        arquivo ausente → 400 `invalid_payload`; Content-Length acima de
        stt_max_bytes → 413 `audio_too_large`; enabled=false → 400
        `voice_disabled`. Provider → 502 como no /tts.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de áudio (webm/ogg/mp3/wav/m4a).
      responses:
        '200':
          description: Transcrição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SttResult'
        '400':
          description: Arquivo ausente ou voz desabilitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Áudio acima de stt_max_bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider de voz indisponível ou erro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/voice:
    get:
      tags: [voice]
      summary: Ler configuração de voz (TTS/STT)
      operationId: getVoiceSettings
      responses:
        '200':
          description: Config efetiva (api_key mascarada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettings'
    put:
      tags: [voice]
      summary: Atualizar configuração de voz (TTS/STT)
      operationId: putVoiceSettings
      description: narrator_voice fora da lista → 400 invalid_voice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceSettingsUpdate'
      responses:
        '200':
          description: Configuração aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSettings'
        '400':
          description: narrator_voice inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------------- health
  /api/health/llm:
    get:
      tags: [health]
      summary: Status do servidor LLM + modelo descoberto
      operationId: healthLlm
      description: |
        Sonda `GET {base_url}/models` em tempo real: confirma alcance, auth e
        devolve o modelo que será usado na geração (descoberta automática
        quando `model_alias = "auto"`).
      responses:
        '200':
          description: Sempre 200; o campo `status` informa a saúde do LLM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmHealth'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token devolvido por POST /api/auth/login (HMAC-SHA256, TTL de settings.auth.token_ttl_hours).

  parameters:
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
    AdventureId:
      name: adventureId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: integer
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente/inválido/expirado, ou credenciais inválidas no login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Payload inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ------------------------------------------------------------------ auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Bearer token (formato base64url(user).base64url(exp).assinatura_hex).
        expires_at:
          type: string
          format: date-time


    # ------------------------------------------------------------- entities
    Scenario:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          description: UUID.
        title:
          type: string
        description:
          type: string
          default: ''
        ai_instructions:
          type: string
          default: ''
          description: Prompt/instruções de estilo do scenario (bloco 1 do sanduíche).
        plot_essentials:
          type: string
          default: ''
          description: '"Memory" fixo: quem é você, mundo, regras (bloco 2).'
        authors_note:
          type: string
          default: ''
          description: Nota de estilo injetada perto do fim do contexto (bloco 7).
        opening_text:
          type: string
          default: ''
          description: Texto de abertura — vira a action `start` da aventura.
        tags:
          type: array
          items:
            type: string
          default: []
        story_cards:
          type: array
          default: []
          description: Cards iniciais do rascunho do assistente (v2) — herdados como story_cards da aventura criada a partir deste scenario.
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
        third_person:
          type: boolean
          default: false
          description: Narração em 3ª pessoa (padrão AI Dungeon é 2ª pessoa).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScenarioCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        ai_instructions:
          type: string
        plot_essentials:
          type: string
        authors_note:
          type: string
        opening_text:
          type: string
        tags:
          type: array
          items:
            type: string
        story_cards:
          type: array
          description: Opcional (v2) — cards do rascunho revisado do assistente; persistidos no scenario e herdados pela aventura.
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
        third_person:
          type: boolean
          default: false

    Adventure:
      type: object
      required: [id, title, source]
      properties:
        id:
          type: string
          description: UUID.
        scenario_id:
          type: string
          nullable: true
          description: Scenario de origem (null em aventuras importadas/vazias sem vínculo).
        title:
          type: string
        description:
          type: string
          default: ''
        ai_instructions:
          type: string
          default: ''
        plot_essentials:
          type: string
          default: ''
        authors_note:
          type: string
          default: ''
        story_summary:
          type: string
          default: ''
          description: Resumo rolante (bloco 5), mantido pelo summarizer.
        image_style:
          type: string
          default: ''
          description: Prefixo de estilo visual para o prompt_builder de imagens (state.imageStyle no backup).
        tags:
          type: array
          items:
            type: string
          default: []
        third_person:
          type: boolean
          default: false
        source:
          type: string
          enum: [new, import]
          default: new
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdventureCreate:
      type: object
      properties:
        scenario_id:
          type: string
          nullable: true
          description: Se presente, herda campos do scenario e cria a action `start`.
        title:
          type: string
          description: Sobrescreve o título herdado do scenario.
        tags:
          type: array
          items:
            type: string

    AdventureSummary:
      type: object
      description: Card da home.
      required: [id, title, source]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [new, import]
        action_count:
          type: integer
        last_excerpt:
          type: string
          description: Último trecho da história (preview no card).
        updated_at:
          type: string
          format: date-time

    AdventureState:
      allOf:
        - $ref: '#/components/schemas/Adventure'
        - type: object
          properties:
            actions:
              type: array
              description: Histórico completo, ordenado por `seq`.
              items:
                $ref: '#/components/schemas/Action'
            story_cards:
              type: array
              items:
                $ref: '#/components/schemas/StoryCard'
            memories:
              type: array
              items:
                $ref: '#/components/schemas/Memory'

    Action:
      type: object
      required: [id, adventure_id, seq, type, text]
      properties:
        id:
          type: integer
          description: PK autoincrement (não confundir com o id do backup).
        adventure_id:
          type: string
        seq:
          type: integer
          description: Ordem absoluta dentro da aventura (0..N, sem buracos).
        type:
          type: string
          enum: [start, continue, do, say, story, see]
          description: |
            `start` abertura · `do` ação física · `say` fala · `story` narração
            injetada · `continue` resposta da IA · `see` imagem (fase opcional).
        text:
          type: string
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: object
          nullable: true
          description: Presente em actions type=see — imagem vinculada.
          properties:
            id:
              type: string
            url:
              type: string
            prompt:
              type: string

    ActionRequest:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [do, say, story]
          description: Tipos que o jogador pode enviar.
        text:
          type: string
          minLength: 1

    ActionPatch:
      type: object
      required: [text]
      properties:
        text:
          type: string

    UndoResult:
      type: object
      properties:
        removed:
          type: array
          items:
            $ref: '#/components/schemas/Action'
          description: Ações removidas (resposta da IA + ação do jogador, se houve).
        last_action:
          $ref: '#/components/schemas/Action'
        action_count:
          type: integer

    StoryCard:
      type: object
      required: [id, adventure_id]
      properties:
        id:
          type: string
          description: UUID.
        adventure_id:
          type: string
        title:
          type: string
          default: ''
        type:
          type: string
          default: other
          description: Categoria livre (ex. location, character, item, faction, concept).
        triggers:
          type: array
          items:
            type: string
          default: []
          description: Palavras-chave (case-insensitive) que injetam o card no contexto.
        entry:
          type: string
          default: ''
          description: Texto injetado quando um trigger dispara (ou sempre, se pinned).
        pinned:
          type: boolean
          default: false
          description: Pinned = sempre presente no contexto.
        use_for_character_creation:
          type: boolean
          default: false
        portrait_image_id:
          type: string
          nullable: true
          description: v0.3.0 — id da imagem de retrato atual (definido pelo job character_portrait; não editável via PATCH).
        portrait_prompt:
          type: string
          default: ''
          description: v0.3.0 — prompt do retrato; se vazio, o LLM escreve um a partir de entry + contexto da aventura (e persiste aqui).
        voice:
          type: string
          default: ''
          description: v0.3.0 — voz TTS do NPC ('', M1, M2, M3, F1, F2, F3 — Supertonic).
        vrm_id:
          type: string
          default: ''
          description: Config do avatar 3D do NPC (JSON de serializeAvatarConfig —
            modelo GLB/corpo/mood do TalkingHead; nome da coluna mantido por
            compatibilidade de schema).
        sheet:
          type: string
          default: ''
          description: |
            v0.5.0 — ficha estruturada do NPC como JSON string ('' = sem ficha).
            Objeto: {appearance, body, clothing, personality, notes (textos de
            1-2 frases), stats: {str, dex, con, int, wis, cha (1-20)}}.
            Preenchida pelo endpoint enrich, editável via PATCH (dict no body) e
            usada para enriquecer o prompt do retrato.
        portrait:
          type: object
          nullable: true
          description: v0.3.0 — retrato atual do NPC (mesmo recorte de Action.image).
          properties:
            id:
              type: string
            url:
              type: string
            prompt:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoryCardUpsert:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        triggers:
          type: array
          items:
            type: string
        entry:
          type: string
        pinned:
          type: boolean
        use_for_character_creation:
          type: boolean
        portrait_prompt:
          type: string
        voice:
          type: string
        vrm_id:
          type: string
        sheet:
          type: object
          description: v0.5.0 — ficha estruturada (dict no body; persistida como JSON string).

    Job:
      type: object
      description: Job do pipeline assíncrono de assets (v0.3.0).
      required: [id, adventure_id, type, status]
      properties:
        id:
          type: string
        adventure_id:
          type: string
        type:
          type: string
          enum: [character_portrait]
        status:
          type: string
          enum: [pending, running, done, error, canceled]
        ref_id:
          type: string
          description: Alvo do job (character_portrait → id do story card).
        payload:
          type: object
        result:
          type: object
          nullable: true
          description: 'character_portrait done → {"image": {id, url, prompt}, "card_id", "prompt"}.'
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    Memory:
      type: object
      description: Entrada do Memory Bank (resumo automático de eventos antigos).
      required: [id, adventure_id, text]
      properties:
        id:
          type: integer
        adventure_id:
          type: string
        text:
          type: string
        seq_start:
          type: integer
          nullable: true
          description: Primeiro `seq` coberto pelo resumo.
        seq_end:
          type: integer
          nullable: true
          description: Último `seq` coberto pelo resumo.
        created_at:
          type: string
          format: date-time

    MemoryState:
      type: object
      properties:
        plot_essentials:
          type: string
        authors_note:
          type: string
        story_summary:
          type: string
          readOnly: true
          description: Mantido automaticamente pelo summarizer (não editável aqui).

    MemoryUpdate:
      type: object
      properties:
        plot_essentials:
          type: string
        authors_note:
          type: string

    ImportReport:
      type: object
      properties:
        adventure_id:
          type: string
        title:
          type: string
        actions_imported:
          type: integer
        cards_imported:
          type: integer
        memories_imported:
          type: integer
        warnings:
          type: array
          items:
            type: string
          description: Divergências não fatais (ex. card sem título, id fora de sequência).

    LlmSettings:
      type: object
      description: Área de configuração do servidor LLM (config/settings.json + overrides do banco).
      properties:
        provider:
          type: string
          example: llamacpp
        base_url:
          type: string
          example: http://vm.groupabz.com:1234/v1
        api_key:
          type: string
          nullable: true
          example: "sk-…9f2a"
          description: Sempre mascarada nas respostas.
        model_alias:
          type: string
          example: auto
          description: '"auto" = descobre via GET {base_url}/models; ou id explícito do modelo.'
        model_discovered:
          type: string
          nullable: true
          example: Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ2_M.gguf
          description: Modelo que será usado de fato na geração (preenchido pela descoberta).
        context_size:
          type: integer
          example: 8192
          description: Janela total de contexto; a janela recente absorve a diferença (regra em settings.json).
        max_tokens:
          type: integer
          example: 300
          description: Tamanho máximo da resposta da IA (slider 100–600 na UI).
        streaming:
          type: boolean
          default: true
        disable_thinking:
          type: boolean
          default: true
          description: Envia chat_template_kwargs.enable_thinking=false (obrigatório p/ modelos Qwen3.x híbridos; senão content volta vazio).
        timeout_seconds:
          type: integer
          example: 180
        temperature:
          type: number
          example: 0.85
          description: Sampler efetivo (override sampler.temperature > settings.json sampler).
        top_p:
          type: number
          example: 0.95
        repetition_penalty:
          type: number
          example: 1.08

    LlmSettingsUpdate:
      type: object
      description: Todos os campos opcionais; omitidos permanecem.
      properties:
        base_url:
          type: string
        api_key:
          type: string
          nullable: true
          description: Enviar string vazia remove a chave; omitir mantém.
        model_alias:
          type: string
        context_size:
          type: integer
          minimum: 4096
          maximum: 131072
        max_tokens:
          type: integer
          minimum: 100
          maximum: 600
        streaming:
          type: boolean
        disable_thinking:
          type: boolean
        timeout_seconds:
          type: integer
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
          description: Persistido como override sampler.temperature.
        top_p:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Persistido como override sampler.top_p.
        repetition_penalty:
          type: number
          minimum: 1.0
          maximum: 2.0
          description: Persistido como override sampler.repetition_penalty.

    LlmHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unreachable, auth_error, error]
        provider:
          type: string
          example: llamacpp
        base_url:
          type: string
          example: http://vm.groupabz.com:1234/v1
        model_alias:
          type: string
          example: auto
        model_discovered:
          type: string
          nullable: true
          example: Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ2_M.gguf
        model_loaded:
          type: boolean
        details:
          type: string
          nullable: true
          description: Mensagem de erro ou informação extra do runtime.

    SseStream:
      type: string
      description: |
        Fluxo `text/event-stream`. Eventos possíveis:
        - `token`: `data: {"token": "<trecho>"}` — um por token gerado;
        - `done`:  `data: {"player_action"?: {Action}, "action": {Action}}` —
          fim da geração, com a(s) action(s) persistida(s);
        - `error`: `data: {"message": "<motivo>"}` — falha; o stream encerra.

    # ------------------------------------------------------- v2: assistant/images
    ChoicesResponse:
      type: object
      required: [choices]
      properties:
        choices:
          type: array
          description: Exatamente settings.choices.count itens (default 3); vazio quando desabilitado.
          items:
            type: object
            required: [type, text]
            properties:
              type:
                type: string
                enum: [do, say, story]
              text:
                type: string
                maxLength: 120
                description: Sugestão curta em inglês.

    AssistantScenarioRequest:
      type: object
      required: [brief]
      properties:
        brief:
          type: string
          minLength: 3
          description: Ideia em linguagem natural (qualquer idioma). Ex. "pirata steampunk caçando um leviatã".
        language:
          type: string
          default: en
          description: Idioma dos textos gerados (padrão en, convenção do jogo).

    ScenarioDraft:
      type: object
      description: Rascunho estruturado de cenário (não persistido — revisar e depois POST /api/scenarios).
      properties:
        title:
          type: string
        description:
          type: string
        ai_instructions:
          type: string
        plot_essentials:
          type: string
          description: "Ficha do protagonista + premissa (formato '[Name: ...]' como o backup real)."
        authors_note:
          type: string
        opening_text:
          type: string
          description: Abertura em 2ª pessoa — vira a action start.
        tags:
          type: array
          items:
            type: string
        story_cards:
          type: array
          description: 3–8 cards iniciais (NPCs, locais, facções) com triggers coerentes.
          items:
            $ref: '#/components/schemas/StoryCardUpsert'

    AssistantFieldRequest:
      type: object
      required: [field]
      properties:
        field:
          type: string
          enum: [title, description, ai_instructions, plot_essentials, authors_note, opening_text, tags, story_cards]
        brief:
          type: string
          description: Ideia original (contexto primário).
        current:
          type: string
          description: Valor atual do campo (para regenerar mantendo direção).
        draft:
          $ref: '#/components/schemas/ScenarioDraft'
          description: Rascunho atual completo (coerência cruzada).

    AssistantFieldResponse:
      type: object
      properties:
        field:
          type: string
        value:
          type: string
          description: Presente para campos de texto; tags vem como string separada por vírgula.
        story_cards:
          type: array
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
          description: Presente quando field=story_cards.

    SeeRequest:
      type: object
      required: [action_seq]
      properties:
        action_seq:
          type: integer
          description: Seq da ação cuja cena será ilustrada (normalmente a última continue).
        extra_prompt:
          type: string
          description: Detalhe extra do jogador para a imagem (opcional).

    ImageResult:
      type: object
      required: [id, url, prompt]
      properties:
        id:
          type: string
        url:
          type: string
          description: /api/images/{id} — servir com Bearer.
        prompt:
          type: string
          description: Prompt final enviado ao provedor (após prompt_builder).
        provider:
          type: string
        action:
          $ref: '#/components/schemas/Action'
          description: A action type=see persistida e vinculada.

    ImageSettings:
      type: object
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [sdwebui, openai_compatible]
        sdwebui_base_url:
          type: string
          example: http://127.0.0.1:7860
        sdwebui_steps:
          type: integer
        sdwebui_width:
          type: integer
        sdwebui_height:
          type: integer
        negative_prompt:
          type: string
        openai_base_url:
          type: string
        openai_api_key:
          type: string
          nullable: true
          description: Sempre mascarada.
        openai_model:
          type: string
        openai_size:
          type: string
          example: 512x512
        style_suffix:
          type: string

    ImageSettingsUpdate:
      type: object
      description: Campos omitidos permanecem.
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [sdwebui, openai_compatible]
        sdwebui_base_url:
          type: string
        sdwebui_steps:
          type: integer
        sdwebui_width:
          type: integer
        sdwebui_height:
          type: integer
        negative_prompt:
          type: string
        openai_base_url:
          type: string
        openai_api_key:
          type: string
          nullable: true
          description: String vazia remove; omitir mantém.
        openai_model:
          type: string
        openai_size:
          type: string
        style_suffix:
          type: string

    VoiceList:
      type: object
      properties:
        voices:
          type: array
          items:
            type: string
          example: [M1, M2, M3, F1, F2, F3]
        narrator_voice:
          type: string
          example: M1

    TtsRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Texto a sintetizar (até max_text_chars).
        voice:
          type: string
          nullable: true
          description: Voz TTS (M1–M3, F1–F3); omitida usa narrator_voice.

    SttResult:
      type: object
      properties:
        text:
          type: string
          description: Transcrição do áudio (formato OpenAI whisper).

    VoiceSettings:
      type: object
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
          example: https://vm.groupabz.com/voice/v1
        tts_model:
          type: string
          example: supertonic-3
        stt_model:
          type: string
          example: whisper-1
        narrator_voice:
          type: string
          example: M1
        voices:
          type: array
          items:
            type: string
        timeout_seconds:
          type: integer
        max_text_chars:
          type: integer
        stt_max_bytes:
          type: integer
        api_key:
          type: string
          nullable: true
          description: Sempre mascarada.
        api_key_set:
          type: boolean
          description: true se há chave efetiva (override ou env VOICE_API_KEY).

    VoiceSettingsUpdate:
      type: object
      description: Campos omitidos permanecem.
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
        tts_model:
          type: string
        stt_model:
          type: string
        narrator_voice:
          type: string
          description: Fora da lista voices → 400 invalid_voice.
        timeout_seconds:
          type: integer
        api_key:
          type: string
          nullable: true
          description: String vazia remove; omitir mantém.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: adventure 3f2a... not found
