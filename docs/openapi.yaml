          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Versão e o pacote canônico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModVersionDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/mods:
    get:
      tags: [mods]
      summary: Mods aplicados na aventura
      operationId: listAdventureMods
      description: Só o dono.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Aplicações, da mais antiga para a mais nova.
          content:
            application/json:
              schema:
                type: object
                required: [mods]
                properties:
                  mods:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppliedMod'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [mods]
      summary: Aplicar uma versão do mod
      operationId: applyMod
      description: |
        Só o dono. Insere cards e links que ainda não existem. Não reescreve
        o que a aventura já tem. Aplicar de novo não duplica.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mod_version_id]
              properties:
                mod_version_id:
                  type: string
      responses:
        '200':
          description: Aplicação, com quantos cards e links entraram agora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModApplyResult'
        '400':
          description: invalid_package.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/mods/{versionId}/enable:
    post:
      tags: [mods]
      summary: Ativar mod já aplicado
      operationId: enableMod
      description: Só o dono. Não reinsere cards.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aplicação com enabled true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedMod'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/mods/{versionId}/disable:
    post:
      tags: [mods]
      summary: Desativar mod sem apagar o conteúdo
      operationId: disableMod
      description: Só o dono. O script do mod deixa de entrar no turno. Cards ficam.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aplicação com enabled false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedMod'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/mods/{versionId}:
    delete:
      tags: [mods]
      summary: Remover a aplicação e o conteúdo dessa origem
      operationId: removeAppliedMod
      description: |
        Só o dono. Apaga cards e links cuja origem é esta versão.
        O mod continua no catálogo.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contagem do que saiu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModRemoveResult'
        '403':
          description: Quem não é o dono.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- users
  /api/users:
    get:
      tags: [users]
      summary: Listar contas
      operationId: listUsers
      description: Só o admin. Não devolve hash de senha.
      responses:
        '200':
          description: Contas e quantas aventuras cada uma possui.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccount'
        '403':
          description: Quem não é o admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [users]
      summary: Criar conta
      operationId: createUser
      description: |
        Só o admin. Username começa com letra e tem 2–32 caracteres
        (`A-Z`, `a-z`, dígito, `_`, `-`). Senha com no mínimo 8 caracteres.
        Nome já usado ou reservado é 409 `user_exists`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Conta criada.
          content:
            application/json:
              schema:
                type: object
                required: [username, role]
                properties:
                  username:
                    type: string
                  role:
                    type: string
                    enum: [user]
        '400':
          description: invalid_user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Quem não é o admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: user_exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{username}:
    delete:
      tags: [users]
      summary: Apagar conta
      operationId: deleteUser
      description: Só o admin. A conta administradora não pode ser apagada (403).
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conta apagada.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, username]
                properties:
                  deleted:
                    type: boolean
                  username:
                    type: string
        '403':
          description: Quem não é admin, ou tentativa de apagar o admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{username}/password:
    put:
      tags: [users]
      summary: Redefinir a senha de outra conta
      operationId: resetUserPassword
      description: Só o admin. Não pede a senha atual. Mínimo de 8 caracteres.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPassword'
      responses:
        '200':
          description: Senha redefinida.
          content:
            application/json:
              schema:
                type: object
                required: [ok, username]
                properties:
                  ok:
                    type: boolean
                  username:
                    type: string
        '400':
          description: invalid_password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Quem não é o admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- world-map
  /api/adventures/{adventureId}/map:
    get:
      tags: [world-map]
      summary: Mapa visível, journal e progressão
      operationId: getWorldMap
      description: |
        Locais são cards `type=location`. Destino de link ainda não descoberto
        não aparece, nem a coordenada nem a imagem.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      responses:
        '200':
          description: Mapa filtrado pela névoa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldMap'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/journal:
    get:
      tags: [world-map]
      summary: Journal visível
      operationId: getJournal
      description: |
        Notas `visibility=dm` ficam só para o dono. Com `dm_mode`, o dono também
        vê entrada de local ainda escondido. O default de `limit` é 40.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 40
      responses:
        '200':
          description: Entradas, da mais nova para a mais antiga.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/JournalEntry'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/adventures/{adventureId}/map/travel/{cardId}:
    post:
      tags: [world-map]
      summary: Viajar para um local ligado
      operationId: travelToLocation
      description: |
        Revela o destino e registra o journal. Sem local atual, ou sem ligação,
        responde 409 `travel_not_allowed`. O mesmo local devolve `travelled` false.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Destino e os links públicos a partir dele.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: travel_not_allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/map/reveal/{cardId}:
    post:
      tags: [world-map]
      summary: Revelar um local sem viajar
      operationId: revealLocation
      description: Não rebaixa descoberta antiga. Local inexistente é 404.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Mapa depois da revelação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldMap'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: reveal_not_allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/map/world-type:
    post:
      tags: [world-map]
      summary: Definir o tipo de mundo
      operationId: setWorldType
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [world_type]
              properties:
                world_type:
                  type: string
                  enum: [real, fictional, franchise, alternate_history]
      responses:
        '200':
          description: Tipo gravado.
          content:
            application/json:
              schema:
                type: object
                required: [world_type]
                properties:
                  world_type:
                    type: string
                    enum: [real, fictional, franchise, alternate_history]
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: invalid_world_type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/map/locations:
    post:
      tags: [world-map]
      summary: Gerar um local novo
      operationId: generateLocation
      description: |
        Cria um card `location`, liga ao local atual quando existe e registra
        o journal. Falha da geração é 422 `location_generation_failed`.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationGenerateRequest'
      responses:
        '200':
          description: Card criado e as fontes, se houve busca.
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: '#/components/schemas/StoryCard'
                  web_sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebSearchHit'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: location_generation_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/adventures/{adventureId}/map/locations/{cardId}/image:
    post:
      tags: [world-map]
      summary: Pedir imagem de um local visível
      operationId: generateLocationImage
      description: |
        Local invisível ou que não é `location` responde 404. Imagem desligada
        é 503 `image_generation_disabled`. Cache quente devolve `ready`.
        Caso contrário enfileira um job e devolve `pending`.
      parameters:
        - $ref: '#/components/parameters/AdventureId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference:
                  type: string
                  default: ''
      responses:
        '200':
          description: Imagem pronta ou job pendente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationImageResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: image_generation_disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token devolvido por POST /api/auth/login (HMAC-SHA256, TTL de settings.auth.token_ttl_hours).
    eventToken:
      type: apiKey
      in: query
      name: token
      description: |
        Mesmo token do login, só em GET /api/adventures/{id}/events e
        /events/history. O access log redige o valor.

  parameters:
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
    AdventureId:
      name: adventureId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: integer
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    MemoryId:
      name: memoryId
      in: path
      required: true
      description: ID numérico da memória individual.
      schema:
        type: integer

  responses:
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente/inválido/expirado, ou credenciais inválidas no login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Payload inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ------------------------------------------------------------------ auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Bearer token (formato base64url(user).base64url(exp).assinatura_hex).
        expires_at:
          type: string
          format: date-time


    # ------------------------------------------------------------- entities
    Scenario:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          description: UUID.
        title:
          type: string
        description:
          type: string
          default: ''
        ai_instructions:
          type: string
          default: ''
          description: Prompt/instruções de estilo do scenario (bloco 1 do sanduíche).
        plot_essentials:
          type: string
          default: ''
          description: '"Memory" fixo: quem é você, mundo, regras (bloco 2).'
        authors_note:
          type: string
          default: ''
          description: Nota de estilo injetada perto do fim do contexto (bloco 7).
        opening_text:
          type: string
          default: ''
          description: Texto de abertura — vira a action `start` da aventura.
        tags:
          type: array
          items:
            type: string
          default: []
        story_cards:
          type: array
          default: []
          description: Cards iniciais do rascunho do assistente (v2) — herdados como story_cards da aventura criada a partir deste scenario.
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
        third_person:
          type: boolean
          default: false
          description: Narração em 3ª pessoa (padrão AI Dungeon é 2ª pessoa).
        owner:
          type: string
          description: Usuário proprietário; somente ele ou admin pode alterar/apagar.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScenarioCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        ai_instructions:
          type: string
        plot_essentials:
          type: string
        authors_note:
          type: string
        opening_text:
          type: string
        tags:
          type: array
          items:
            type: string
        story_cards:
          type: array
          description: Opcional (v2) — cards do rascunho revisado do assistente; persistidos no scenario e herdados pela aventura.
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
        third_person:
          type: boolean
          default: false

    ScenarioUpdate:
      type: object
      description: Todos os campos são opcionais em PATCH; PUT preserva omissões no backend atual.
      properties:
        title:
          type: string
        description:
          type: string
        ai_instructions:
          type: string
        plot_essentials:
          type: string
        authors_note:
          type: string
        opening_text:
          type: string
        tags:
          type: array
          items:
            type: string
        story_cards:
          type: array
          items:
            $ref: '#/components/schemas/StoryCardUpsert'
        third_person:
          type: boolean
        character_rules:
          type: string

    Adventure:
      type: object
      required: [id, title, source]
      properties:
        id:
          type: string
          description: UUID.
        scenario_id:
          type: string
          nullable: true
          description: Scenario de origem (null em aventuras importadas/vazias sem vínculo).
        title:
          type: string
        description:
          type: string
          default: ''
        ai_instructions:
          type: string
          default: ''
        plot_essentials:
          type: string
          default: ''
        authors_note:
          type: string
          default: ''
        character_rules:
          type: string
          default: ''
          maxLength: 4000
          description: Regras de criação de personagem injetadas no narrador. O apply de ruleset grava aqui e corta em 4000 caracteres.
        story_summary:
          type: string
          default: ''
          description: Resumo rolante (bloco 5), mantido pelo summarizer.
        image_style:
          type: string
          default: ''
          description: Prefixo de estilo visual para o prompt_builder de imagens (state.imageStyle no backup).
        tags:
          type: array
          items:
            type: string
          default: []
        third_person:
          type: boolean
          default: false
        source:
          type: string
          enum: [new, import]
          default: new
        owner:
          type: string
          default: ''
        turn_mode:
          type: boolean
          default: false
          description: Mesa em turnos. A vez fica em turn_user.
        turn_user:
          type: string
          default: ''
        dm_mode:
          type: boolean
          default: false
          description: Dono vê journal e mapa que a névoa esconde dos outros.
        publication_id:
          type: string
          nullable: true
        publication_version:
          type: integer
          nullable: true
        life_day:
          type: integer
          default: 0
        life_tick_seq:
          type: integer
          default: 0
        ui_profile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UiProfile'
        ui_state:
          type: object
          additionalProperties: true
          description: Estado dos widgets. Quem não é dono recebe a cópia sem private_facts.
        sim_state:
          type: object
          additionalProperties: true
          description: Blob persistido do motor. A vista filtrada é GET /api/adventures/{id}/sim.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdventureCreate:
      type: object
      properties:
        scenario_id:
          type: string
          nullable: true
          description: Se presente, herda campos do scenario e cria a action `start`.
        title:
          type: string
          description: Sobrescreve o título herdado do scenario.
        tags:
          type: array
          items:
            type: string
        publication_id:
          type: string
          nullable: true
          description: Fonte alternativa a scenario_id. Os dois juntos são 400 invalid_source.
        publication_version:
          type: integer
          minimum: 1
          nullable: true
        image_style:
          type: string
        ai_instructions:
          type: string
        plot_essentials:
          type: string
        authors_note:
          type: string
        third_person:
          type: boolean
        character_rules:
          type: string
          maxLength: 4000
        start_id:
          type: string
          maxLength: 80
          description: Story start escolhido na criação.

    AdventureSummary:
      type: object
      description: Card da home.
      required: [id, title, source]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [new, import]
        owner:
          type: string
          default: ''
        shared_by:
          type: string
          default: ''
          description: Dono, quando a aventura chegou por share. Vazio na própria.
        turn_mode:
          type: boolean
          default: false
        turn_user:
          type: string
          default: ''
        dm_mode:
          type: boolean
          default: false
        action_count:
          type: integer
        last_excerpt:
          type: string
          description: Último trecho da história (preview no card).
        updated_at:
          type: string
          format: date-time

    AdventureState:
      allOf:
        - $ref: '#/components/schemas/Adventure'
        - type: object
          properties:
            actions:
              type: array
              description: Histórico completo, ordenado por `seq`.
              items:
                $ref: '#/components/schemas/Action'
            story_cards:
              type: array
              items:
                $ref: '#/components/schemas/StoryCard'
            memories:
              type: array
              items:
                $ref: '#/components/schemas/Memory'
            shares:
              type: array
              description: Usernames com acesso compartilhado, sem contar o dono duas vezes.
              items:
                type: string
            consistency:
              nullable: true
              description: |
                Relatório da auditoria (C9). Só vem no `POST /api/adventures`
                quando a aventura nasce de um scenario: as fichas determinísticas
                já saem preenchidas (status, classe, atributos) e o resto fica
                para o reparo da aba Check.
              allOf:
                - $ref: '#/components/schemas/ConsistencyReport'

    Action:
      type: object
      required: [id, adventure_id, seq, type, text]
      properties:
        id:
          type: integer
          description: PK autoincrement (não confundir com o id do backup).
        adventure_id:
          type: string
        seq:
          type: integer
          description: Ordem absoluta dentro da aventura (0..N, sem buracos).
        type:
          type: string
          enum: [start, continue, do, say, story, see]
          description: |
            `start` abertura · `do` ação física · `say` fala · `story` narração
            injetada · `continue` resposta da IA · `see` imagem (fase opcional).
        text:
          type: string
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
        adjudication:
          $ref: '#/components/schemas/TurnAdjudication'
        image:
          type: object
          nullable: true
          description: Presente em actions type=see — imagem vinculada.
          properties:
            id:
              type: string
            url:
              type: string
            prompt:
              type: string

    ActionRequest:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [do, say, story]
          description: Tipos que o jogador pode enviar.
        text:
          type: string
          minLength: 1

    ActionPatch:
      type: object
      required: [text]
      properties:
        text:
          type: string

    UndoResult:
      type: object
      properties:
        removed:
          type: array
          items:
            $ref: '#/components/schemas/Action'
          description: Ações removidas (resposta da IA + ação do jogador, se houve).
        last_action:
          $ref: '#/components/schemas/Action'
        action_count:
          type: integer

    StoryCard:
      type: object
      required: [id, adventure_id]
      properties:
        id:
          type: string
          description: UUID.
        adventure_id:
          type: string
        title:
          type: string
          default: ''
        type:
          type: string
          default: other
          description: Categoria livre (ex. location, character, item, faction, concept).
        triggers:
          type: array
          items:
            type: string
          default: []
          description: Palavras-chave (case-insensitive) que injetam o card no contexto.
        entry:
          type: string
          default: ''
          description: Texto injetado quando um trigger dispara (ou sempre, se pinned).
        pinned:
          type: boolean
          default: false
          description: Pinned = sempre presente no contexto.
        use_for_character_creation:
          type: boolean
          default: false
        portrait_image_id:
          type: string
          nullable: true
          description: v0.3.0 — id da imagem de retrato que a UI mostra (definido pelo job character_portrait; não editável via PATCH).
        portrait_anchor_id:
          type: string
          nullable: true
          description: Primeira foto do NPC. Regenerar retrato faz img2img a partir deste arquivo, para manter o mesmo rosto. Não editável via PATCH.
        portrait_prompt:
          type: string
          default: ''
          description: v0.3.0 — prompt do retrato; se vazio, o LLM escreve um a partir de entry + contexto da aventura (e persiste aqui).
        voice:
          type: string
          default: ''
          description: v0.3.0 — voz TTS do NPC ('', M1, M2, M3, F1, F2, F3 — Supertonic).
        vrm_id:
          type: string
          default: ''
          description: Config do avatar 3D do NPC (JSON de serializeAvatarConfig —
            modelo GLB/corpo/mood do TalkingHead; nome da coluna mantido por
            compatibilidade de schema). Poses e gestos reagem ao turno na malha
            configurada; o sistema não gera uma malha nova a partir do retrato.
        sheet:
          type: string
          default: ''
          description: |
            Ficha estruturada do NPC como JSON string ('' = sem ficha).
            Textos: appearance, body, clothing, personality, humor, speech,
            goals, background, lifestyle, habits, likes, sentiments (até 240),
            notes. stats: {str, dex, con, int, wis, cha (1-20)}.
            life: {mood, activity, day, last_tick}.
            reference: {image_path, source, mode, created_at}.
            O narrador lê esses campos via card_canon_text.
        portrait:
          type: object
          nullable: true
          description: v0.3.0 — retrato atual do NPC (mesmo recorte de Action.image).
          properties:
            id:
              type: string
            url:
              type: string
            prompt:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoryCardUpsert:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        triggers:
          type: array
          items:
            type: string
        entry:
          type: string
        pinned:
          type: boolean
        use_for_character_creation:
          type: boolean
        portrait_prompt:
          type: string
        voice:
          type: string
        vrm_id:
          type: string
        sheet:
          type: object
          description: v0.5.0 — ficha estruturada (dict no body; persistida como JSON string).

    CardBulkAction:
      type: object
      required:
        - action
        - card_ids
      properties:
        action:
          type: string
          enum: [delete, pin, unpin, retype]
          description: Operação a ser executada em lote
        card_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Lista de IDs dos story cards a modificar
        new_type:
          type: string
          description: Novo tipo do card (obrigatório se action=retype)

    CardBulkResponse:
      type: object
      required:
        - updated
        - action
      properties:
        updated:
          type: integer
          description: Quantidade de cards afetados pela operação
        action:
          type: string
          description: Ação executada

    Job:
      type: object
      description: Job do pipeline assíncrono de assets (v0.3.0; prioridade e See no contrato C5/C6).
      required: [id, adventure_id, type, status]
      properties:
        id:
          type: string
        adventure_id:
          type: string
        type:
          type: string
          enum: [character_portrait, scene_backdrop, see_image, npc_day_tick, card_assets, scene_clip]
        status:
          type: string
          enum: [preparing, pending, running, done, error, canceled]
          description: '`preparing` só no see_image, enquanto o LLM escreve o prompt.'
        ref_id:
          type: string
          description: Alvo do job (character_portrait → id do story card; scene_backdrop → "<adventure_id>:<assinatura>").
        payload:
          type: object
        priority:
          type: integer
          description: Menor roda antes — 0 see_image, 1 retrato de NPC presente, 2 scene_backdrop, 3 scene_clip/cena, 4 retratos em lote, 5 dia de vida do NPC, 6 card_assets (ficha viva via LLM), 7 retrato animado automático (não roda durante a narrativa).
        supersede_key:
          type: string
          description: Job novo com a mesma chave cancela os que ainda não rodam (fundo usa "backdrop:<adventure_id>"; clipe usa "clip:<adventure_id>:<source_image_id>").
        result:
          type: object
          nullable: true
          description: 'done → character_portrait {"image": {id, url, prompt}, "card_id", "prompt"}; scene_backdrop {"image", "ref_id"}; see_image {"image": ImageResult}; card_assets {"card_id", "filled", "remaining"}; scene_clip {"source_image_id", "image": {id, url, media_type, duration_ms}} e o SSE clip_ready repete adventure_id, job_id, source_image_id e esse image. error → {"code"}.'
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true

    Memory:
      type: object
      description: Entrada do Memory Bank (resumo automático de eventos antigos).
      required: [id, adventure_id, text]
      properties:
        id:
          type: integer
        adventure_id:
          type: string
        text:
          type: string
