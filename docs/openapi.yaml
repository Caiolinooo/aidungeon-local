    ClipRequest:
      type: object
      required: [image_id, prompt]
      properties:
        image_id:
          type: string
          description: PNG raster já gravado nesta aventura (images.id).
        prompt:
          type: string
          description: Movimento do clipe, em texto livre.

    ImageResult:
      type: object
      required: [id, url, prompt]
      properties:
        id:
          type: string
        url:
          type: string
          description: /api/images/{id} — servir com Bearer.
        prompt:
          type: string
          description: Prompt final enviado ao provedor (após prompt_builder).
        provider:
          type: string
        action:
          $ref: '#/components/schemas/Action'
          description: A action type=see persistida e vinculada.

    ImageSettings:
      type: object
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [sdwebui, comfyui, openai_compatible]
