# /etc/systemd/system/sd-webui.service.d/alloc.conf
[Service]
# OOM em lowvram.py send_me_to_gpu: ~210 MiB reservados pelo PyTorch e fragmentados.
# O module.to(cuda) parou no meio e o token embedding do CLIP ficou na CPU,
# enquanto o input_ids seguia em cuda:0 (index_select).
Environment=PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
