# HTTPS do AI Dungeon na VM.
# O uvicorn continua em 127.0.0.1:2122 (HTTP). Este server entrega
# https://vm.groupabz.com:8443 — contexto seguro, então o navegador libera o microfone.
# SSE (geração token a token) precisa de proxy_buffering off.
# O EventSource de /api/adventures/{id}/events leva o token em ?token=, então
# o access log grava a URL sem a query string.
log_format aidungeon_sem_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent"';

server {
    listen 8443 ssl;
    server_name vm.groupabz.com;
    access_log /var/log/nginx/access.log aidungeon_sem_query;

    ssl_certificate /etc/letsencrypt/live/vm.groupabz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vm.groupabz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:2122;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
