# /etc/systemd/system/sd-webui.service.d/memory.conf
[Service]
# G1: sem tcmalloc o A1111 vazava (20 GB RSS + 11 GB swap). Com libtcmalloc-minimal4t64 o anon fica em ~9 GB.
# Acima de MemoryMax o kernel mata e o Restart sobe de novo.
MemoryHigh=12G
MemoryMax=14G
MemorySwapMax=2G
Restart=always
RestartSec=15
